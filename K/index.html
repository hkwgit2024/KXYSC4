<script>

   完整 JS 逻辑
   ============================================================ */

const MODE_KEY = 'site_mode';
const TAB_KEY = 'current_tab';
const VALID_TABS = ['api','more'];

const btn = document.getElementById('modeToggleBtn');
const searchBox = document.getElementById('search');
const mainCard = document.querySelector('.main-card');
const navTabs = document.getElementById('navTabs');

const headerLogo = document.getElementById('header-logo');
const headerSubtitle = document.getElementById('header-subtitle');

const API_DOMAINS = [
  {tag:"备份一线", base:"https://0.12yue.de5.net/tvbox/"},
  {tag:"备份二线", base:"https://0.cdz.qzz.io/tvbox/"},
  {tag:"备份三线", base:"https://0.wdzb.eu.cc/tvbox/"}
];

const API_WEIGHTS = {
  "轮替占位.json":1,"幸福年年.json":2,"饭太硬.json":4,"肥猫.json":5,
  "摸鱼.json":6,"王二小.json":7,"集多.json":8,"潇洒.json":9,"小米.json":10,
  "嗷呜.json":11,"南风.json":12,"小虎斑.json":13
};

const ROTATE_KEYWORDS = ["模糊搜索","模糊搜索"];

let currentMode = localStorage.getItem(MODE_KEY) || 'simple';
let currentTabId = VALID_TABS.includes(localStorage.getItem(TAB_KEY))
  ? localStorage.getItem(TAB_KEY)
  : 'api';

let topSeed = Date.now();
let rawListText = null;

document.body.className = currentMode + '-mode';
updateBtnText();
positionSearchBox();

/* ===== 全局复制 ===== */
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('.copy-btn');
  if (!copyBtn) return;
  e.preventDefault(); e.stopPropagation();
  const url = copyBtn.getAttribute('data-url');
  if (!url) return;
  const done = () => {
    const originalText = copyBtn.textContent;
    copyBtn.textContent = '✅ 已复制';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = originalText; copyBtn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fb);
  } else { fb(); }
  function fb() {
    const input = document.createElement('input'); input.value = url;
    input.style.position='fixed'; input.style.opacity='0';
    document.body.appendChild(input); input.focus(); input.select();
    try{document.execCommand('copy');}catch(_){}
    document.body.removeChild(input); done();
  }
});

/* ===== 工具 ===== */
function getTopItem(rotateItems) {
  if (!rotateItems || !rotateItems.length) return null;
  if (rotateItems.length === 1) return rotateItems[0];
  return rotateItems[Math.abs(Math.floor(Math.sin(topSeed)*10000))%rotateItems.length];
}
function formatDateToChinese(d) {
  if(!d||d.length!==8) return '----';
  return d.slice(0,4)+'年'+d.slice(4,6)+'月'+d.slice(6,8)+'日';
}
function isRecent(d) {
  if(!d||d.length!==8) return false;
  const y=parseInt(d.slice(0,4)),m=parseInt(d.slice(4,6))-1,day=parseInt(d.slice(6,8));
  return (Date.now()-new Date(y,m,day).getTime())/86400000 <= 2;
}

/* ===== 点播 ===== */
async function fetchListText() {
  if(rawListText!==null) return rawListText;
  const res = await fetch('list.txt?t='+Date.now()+'&r='+Math.random(), {cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  rawListText = await res.text(); return rawListText;
}
function parseItems(text) {
  if(!text||!text.trim()) return [];
  return text.trim().split('\n').filter(l=>l.trim()).map(line=>{
    const p=line.split('|').map(s=>s.trim()); if(!p[0]) return null;
    return {file:p[0],name:p[0].replace(/\.json$/i,''),date:p[1]||'',size:p[2]||'',origUrl:p[3]||'',weight:API_WEIGHTS.hasOwnProperty(p[0])?API_WEIGHTS[p[0]]:999};
  }).filter(Boolean);
}
function renderApi() {
  const container = document.getElementById('listContainer');
  fetchListText().then(text=>{
    const tip=document.getElementById('apiLoading'); if(tip) tip.style.display='none';
    let items=parseItems(text);
    if(!items.length){container.innerHTML='<div class="error-msg">⚠️ 接口列表为空，请检查 list.txt</div>';return;}
    const ri=items.filter(i=>ROTATE_KEYWORDS.some(kw=>i.name.toLowerCase().includes(kw.toLowerCase())));
    const top=getTopItem(ri); if(top) top.weight=Number.MIN_SAFE_INTEGER;
    items.sort((a,b)=>a.weight-b.weight);
    let html='';
    items.forEach(it=>{
      const isNew=isRecent(it.date); let lines='';
      if(it.origUrl) lines+=`<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`;
      API_DOMAINS.forEach(d=>{const u=d.base+it.name+'.json';lines+=`<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${u}</span><button class="copy-btn" data-url="${u}">复制</button></div>`;});
      html+=`<div class="api-item" data-name="${it.name.toLowerCase()}"><div class="api-item-header"><div class="api-item-name" title="${it.name}">${it.name}</div><div class="api-item-meta"><span class="${isNew?'badge-new':'badge-old'}">备份时间 ${formatDateToChinese(it.date)}</span>${it.size?'&nbsp;&nbsp;'+it.size:''}</div></div><div class="api-item-urls">${lines}</div></div>`;
    });
    container.innerHTML=html;
  }).catch(err=>{
    const tip=document.getElementById('apiLoading'); if(tip) tip.style.display='none';
    container.innerHTML=`<div class="error-msg">❌ 接口加载失败：${err.message||err}</div>`;
  });
}

/* ===== 更多面板（config.json 动态渲染） ===== */
let configData = null;

async function loadConfig() {
  if (configData) return configData;
  const res = await fetch('config.json?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  configData = await res.json();
  return configData;
}

function renderApiItemCard(item) {
  let noteHtml = item.note ? `<div style="font-size:.68rem;color:#8b9eb0;margin-top:6px">${item.note}</div>` : '';
  return `<div class="api-item" data-name="${item.name.toLowerCase()}">
  <div class="api-item-header">
    <div class="api-item-name" title="${item.name}">${item.name}</div>
    <div class="api-item-meta"><span class="badge-new">${item.badge || ''}</span></div>
  </div>
  <div class="api-item-urls">
    <div class="url-line">
      <span class="url-tag">${item.tag || '导入'}</span>
      <span class="url-text">${item.url}</span>
      <button class="copy-btn" data-url="${item.url}">复制</button>
    </div>
  </div>
  ${noteHtml}
</div>`;
}

function renderOnlineItem(item) {
  const host = (item.url.match(/https?:\/\/([^/]+)/) || [, ''])[1];
  const ph = item.name.charAt(0);
  return `<a class="online-item" href="${item.url}" target="_blank" rel="noopener noreferrer">
  <span class="online-item-icon"><img src="https://favicon.im/${host}?larger=true" alt="${item.name}" loading="lazy" onerror="this.onerror=null;this.src='https://icon.horse/icon/${host}';this.addEventListener('error',()=>{this.style.display='none';this.nextElementSibling.style.display='flex';},{once:true})"><span class="site-ph" style="display:none">${ph}</span></span>
  <div class="online-item-info"><div class="online-item-name">${item.name}</div><div class="online-item-desc">${item.desc}</div></div>
</a>`;
}

function renderSourceGroup(title, description, items, isOnlineVideo) {
  let bodyHtml = '';
  if (isOnlineVideo) {
    bodyHtml = `<div class="online-list">${items.map(renderOnlineItem).join('\n')}</div>`;
  } else {
    bodyHtml = `<div class="api-list">${items.map(renderApiItemCard).join('\n')}</div>`;
  }

  return `<div style="background:#f8fafc;border-radius:12px;padding:14px 16px;border:1px solid #eef2f7">
  <h3 style="font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:4px">${title}</h3>
  <p style="font-size:.76rem;color:#5a6f88;margin-bottom:4px">${description}</p>
  ${bodyHtml}
</div>`;
}

async function renderMore() {
  const container = document.getElementById('more-content');
  if (!container || container.dataset.rendered) return;
  container.dataset.rendered = 'true';
  container.className = 'has-sidebar';
  container.innerHTML = `<div class="loading">⏳ 正在加载更多资源...</div>`;

  let cfg;
  try {
    cfg = await loadConfig();
  } catch (err) {
    container.innerHTML = `<div class="error-msg">❌ 配置加载失败：${err.message || err}<br>请确认 config.json 文件存在且可访问。</div>`;
    container.dataset.rendered = '';
    return;
  }

  // 渲染侧边栏
  const tabs = cfg.moreTabs || [];
  const sidebarHtml = tabs.map((t, i) =>
    `<button class="dl-side-btn${i === 0 ? ' active' : ''}" data-more-tab="${t.id}">
      <span class="dl-side-icon">${t.icon}</span>
      <span>${t.label}</span>
    </button>`
  ).join('\n');

  // 渲染每个面板
  const panelMap = {
    'book-source': cfg.bookSource,
    'comic-source': cfg.comicSource,
    'music-source': cfg.musicSource,
    'online-video': cfg.onlineVideo
  };

  const bodyHtml = tabs.map((t, i) => {
    const data = panelMap[t.id];
    if (!data) return '';
    const isOnline = t.id === 'online-video';
    const content = renderSourceGroup(data.title, data.description, data.items, isOnline);
    return `<div class="more-group${i === 0 ? ' active' : ''}" id="more-${t.id}">${content}</div>`;
  }).join('\n');

  container.innerHTML = `
    <div class="dl-sidebar" id="moreSidebar">
      ${sidebarHtml}
    </div>
    <div class="dl-body" id="moreBody">
      ${bodyHtml}
    </div>`;

  // 侧边栏切换逻辑
  document.querySelectorAll('#moreSidebar .dl-side-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#moreSidebar .dl-side-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.getAttribute('data-more-tab');
      document.querySelectorAll('.more-group').forEach(g => g.classList.remove('active'));
      const target = document.getElementById('more-' + tab);
      if (target) target.classList.add('active');
    });
  });
}

/* ===== 导航 ===== */
const tabsData = [
  {id:"api",label:"点播"},
  {id:"more",label:"更多"}
];

function renderTabs() {
  navTabs.innerHTML=tabsData.map(t=>`<button class="nav-tab ${t.id===currentTabId?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  navTabs.querySelectorAll('.nav-tab').forEach(tab=>{
    tab.addEventListener('click',function(){
      navTabs.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      this.classList.add('active');
      currentTabId=this.getAttribute('data-tab');
      localStorage.setItem(TAB_KEY, currentTabId);
      showPanel(currentTabId);
    });
  });
}

function showPanel(tabId) {
  if(searchBox){
    searchBox.value='';
    document.querySelectorAll('#api-panel .api-item.hidden').forEach(e=>e.classList.remove('hidden'));
  }

  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(tabId+'-panel'); if(panel) panel.classList.add('active');

  const hideSearchTabs = ['more'];
  if(searchBox){
    searchBox.style.display = hideSearchTabs.includes(tabId) ? 'none' : '';
  }

  if(tabId==='api'){
    topSeed=Date.now()+Math.random();
    renderApi();
  }
  if(tabId==='more') renderMore();
}

/* ===== 搜索 ===== */
function globalSearch() {
  const kw=(searchBox.value||'').toLowerCase().trim();
  document.querySelectorAll('#api-panel .api-item').forEach(e=>{const n=e.getAttribute('data-name')||'';e.classList.toggle('hidden',!n.includes(kw));});
}

function positionSearchBox() {
  if(currentMode==='simple'){
    if(searchBox.parentNode!==mainCard.parentNode) mainCard.parentNode.insertBefore(searchBox,mainCard);
  } else {
    if(searchBox.parentNode!==mainCard) navTabs.insertAdjacentElement('afterend',searchBox);
  }
}
function updateBtnText(){btn.innerHTML=currentMode==='simple'?'切换<br>全能版':'切换<br>简洁版';}

btn.addEventListener('click',()=>{
  topSeed=Date.now()+Math.random();
  currentMode=currentMode==='simple'?'full':'simple';
  localStorage.setItem(MODE_KEY,currentMode);
  document.body.className=currentMode+'-mode';
  updateBtnText();

  if(currentMode!=='simple'){
    positionSearchBox();
    renderTabs();
    showPanel(currentTabId);
  } else {
    currentTabId='api';
    localStorage.setItem(TAB_KEY,'api');
    searchBox.style.display='';
    positionSearchBox();
    renderApi();
  }
});

renderTabs();

if (currentMode === 'simple') {
  currentTabId = 'api';
  localStorage.setItem(TAB_KEY, 'api');
  renderApi();
} else {
  showPanel(currentTabId);
}
</script>
