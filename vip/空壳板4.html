<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title id="page-title">加载中...</title>
<style>
:root {
  --primary: #4a9eff;
  --primary-dark: #1e6fda;
  --success: #16a34a;
  --warning: #ca8a04;
  --danger: #dc2626;
  --bg: #eef2f7;
  --card-bg: #ffffff;
  --text-main: #0a1a2b;
  --text-muted: #7a8fa3;
  --border: #d4dbe5;
  --border-light: #e4ebf3;
  --tag-bg: #d8e8f8;
  --tag-text: #3a5a7a;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 50px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:var(--bg); color:var(--text-main);
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button:focus, button:focus-visible, input:focus, input:focus-visible,
.nav-tab:focus, .copy-btn:focus { outline:none !important; }

.container { max-width:820px; margin:0 auto; position:relative; width:100%; overflow-x:hidden; flex:1; display:flex; flex-direction:column; }

#modeToggleBtn {
  position:absolute; top:14px; left:10px; z-index:999;
  width:56px; padding:6px 4px; border-radius:var(--radius-full);
  border:1px solid var(--primary); background:#fff; color:var(--primary);
  font-size:.58rem; line-height:1.3; text-align:center; cursor:pointer;
}

.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }
h1 { font-size:1.35rem; font-weight:700; color:var(--text-main); }
h1 .header-logo {
  width:2rem; height:2rem; border-radius:50%; border:1px solid var(--primary);
  object-fit:cover; vertical-align:-.5rem; margin-right:8px;
}
.header-divider { height:1px; background:var(--border-light); margin:12px 0; }
.subtitle { font-size:.78rem; color:var(--text-muted); line-height:1.6; }

.search-box {
  width:100%; padding:10px 16px; border:1px solid var(--border);
  border-radius:var(--radius-full); font-size:.92rem; background:#fff; outline:none; -webkit-appearance:none;
}
body.simple-mode .search-box { margin-bottom:20px; }
body:not(.simple-mode) .search-box { margin-bottom:14px; }

.main-card {
  background:var(--card-bg); border-radius:var(--radius-md); padding:20px 22px 18px;
  border:1px solid var(--border); width:100%; overflow-x:hidden; flex:1;
}

.nav-tabs {
  display:flex; gap:6px; margin-bottom:14px; justify-content:center;
  flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 0;
}
.nav-tabs::-webkit-scrollbar { display:none; }
.nav-tab {
  padding:5px 12px; border:1.5px solid var(--primary); border-radius:30px;
  background:#fff; color:var(--primary); font-size:.72rem; font-weight:500;
  cursor:pointer; white-space:nowrap; flex-shrink:0; line-height:1.2;
}
.nav-tab.active { background:var(--primary); color:#fff; }
.nav-tab:active { transform:scale(.95); }

.tab-panel { display:none; width:100%; }
.tab-panel.active { display:block; }

.copy-btn {
  flex-shrink:0; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-full);
  padding:0 14px; font-size:.7rem; font-weight:500; cursor:pointer; height:26px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, transform .05s; white-space:nowrap; margin-left:auto;
  position:relative; z-index:2; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.copy-btn:active { background:var(--primary-dark); transform:scale(.96); }
.copy-btn.copied { background:var(--success); }

.loading { text-align:center; color:var(--text-muted); padding:60px 0; font-size:.88rem; }
.error-msg { text-align:center; color:var(--danger); padding:16px 20px; font-size:.8rem; background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-sm); margin:12px 0; word-break:break-all; }

.page-footer { text-align:center; padding:24px 0 10px; font-size:.7rem; color:var(--text-muted); line-height:1.8; margin-top:auto; }

body.simple-mode .nav-tabs { display:none !important; }
body.simple-mode #live-panel,
body.simple-mode #download-panel,
body.simple-mode #danmu-panel,
body.simple-mode #about-panel { display:none !important; }
body.simple-mode #api-panel { display:block !important; }

/* 点播 */
.api-list { display:flex; flex-direction:column; width:100%; }
.api-item { padding:14px 0; border-bottom:1px solid var(--border-light); }
.api-item:last-child { border-bottom:none; }
.api-item.hidden { display:none !important; }
.api-item-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.api-item-name { font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.api-item-meta { display:flex; align-items:center; gap:8px; font-size:.72rem; white-space:nowrap; flex-shrink:0; }
.badge-new { color:var(--success); font-weight:600; }
.badge-old { color:var(--warning); font-weight:600; }
.api-item-urls { display:flex; flex-direction:column; gap:6px; }
.url-line { display:flex; align-items:center; gap:8px; padding:6px 14px; background:#f4f8fc; border:1px solid #e0e8f0; border-radius:var(--radius-full); min-width:0; }
.url-tag { font-size:.68rem; font-weight:600; color:var(--tag-text); background:var(--tag-bg); padding:2px 14px; border-radius:var(--radius-full); white-space:nowrap; flex-shrink:0; }
.url-text { font-size:.78rem; color:var(--primary); word-break:break-all; overflow-wrap:break-word; line-height:1.4; flex:1; min-width:0; }

/* 直播 */
#live-panel { overflow-x:hidden; width:100%; }
.live-top-aggregate {
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius:var(--radius-xl); padding:18px 20px; margin-bottom:18px; color:#fff;
  box-shadow:0 4px 12px rgba(74,158,255,.3); overflow-x:hidden;
}
.live-top-aggregate h3 { font-size:1.05rem; font-weight:700; margin-bottom:10px; }
.live-top-aggregate .domain-line {
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  margin-top:10px; display:flex; align-items:center; gap:10px; padding:8px 16px; border-radius:var(--radius-full); min-width:0;
}
.live-top-aggregate .domain-line span { flex:1; font-size:.74rem; font-weight:500; word-break:break-all; overflow-wrap:break-word; }
.live-top-aggregate .copy-btn { position:relative; z-index:2; background:rgba(255,255,255,.92); color:#1a4a7a; margin-left:0; }
.live-top-aggregate .copy-btn:active { transform:scale(.96); background:rgba(255,255,255,1); }
.live-top-aggregate .copy-btn.copied { background:#d1f5e0; color:#0a6a3a; }
.live-top-aggregate .domain-line span { pointer-events:none; }
.live-list { display:flex; flex-direction:column; width:100%; }
.live-item { padding:14px 0; border-bottom:1px solid var(--border-light); }
.live-item:last-child { border-bottom:none; }
.live-item.hidden { display:none !important; }
.live-item-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.live-item-name { font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.live-item-meta { display:flex; align-items:center; gap:8px; font-size:.72rem; white-space:nowrap; flex-shrink:0; }
.live-badge-new { color:var(--success); font-weight:600; }
.live-badge-old { color:var(--warning); font-weight:600; }
.live-item-urls { display:flex; flex-direction:column; gap:6px; }
.live-url-line { background:#f4f8fc; border:1px solid #e0e8f0; border-radius:var(--radius-md); padding:10px 14px; display:flex; flex-direction:column; gap:6px; width:100%; min-width:0; }
.live-info-inline { display:flex; align-items:center; gap:6px; font-size:.65rem; color:var(--text-muted); line-height:1.4; flex-wrap:wrap; word-break:break-all; }
.live-info-inline .sep { color:#b8c8d8; }
.live-url-body { display:flex; align-items:center; gap:8px; min-width:0; }
.live-url-tag { font-size:.68rem; font-weight:600; color:var(--tag-text); background:var(--tag-bg); padding:2px 14px; border-radius:var(--radius-full); white-space:nowrap; flex-shrink:0; }
.live-url-text { font-size:.78rem; color:var(--primary); word-break:break-all; overflow-wrap:break-word; line-height:1.4; flex:1; min-width:0; }

/* 下载 */
#download-panel { overflow-x:hidden; width:100%; }
#downloads-content { width:100%; overflow-x:hidden; }
#downloads-content.has-sidebar { display:flex; flex-direction:row; gap:12px; align-items:flex-start; }
.dl-sidebar { flex:0 0 auto; width:96px; display:flex; flex-direction:column; gap:8px; padding:4px 2px 4px 0; position:sticky; top:0; align-self:flex-start; max-height:72vh; overflow-y:auto; }
.dl-side-btn {
  width:100%; padding:11px 6px; border:1.5px solid var(--primary); border-radius:12px;
  background:#fff; color:var(--primary); font-size:.76rem; font-weight:600; line-height:1.3;
  cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
  word-break:break-word; transition:background .15s, color .15s, transform .05s;
}
.dl-side-btn .dl-side-icon { font-size:1.15rem; line-height:1; }
.dl-side-btn.active { background:var(--primary); color:#fff; }
.dl-side-btn:active { transform:scale(.96); }
.dl-body { flex:1; min-width:0; }
.dl-group { display:none; width:100%; }
.dl-group.active { display:block; }
.dl-group-title { font-size:.95rem; font-weight:600; margin-bottom:2px; }
.dl-group-desc { font-size:.7rem; color:var(--text-muted); margin-bottom:10px; }
.dl-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; width:100%; max-width:100%; overflow:hidden; }
.download-card {
  background:#fff; border-radius:var(--radius-md); padding:16px 14px 22px; text-align:center;
  border:1px solid var(--border-light); text-decoration:none; color:inherit;
  display:flex; flex-direction:column; align-items:center; min-height:170px; min-width:0; max-width:100%; overflow:hidden;
}
.download-card.hidden { display:none !important; }
.download-card img { width:80%; max-width:100%; aspect-ratio:1/1; border-radius:var(--radius-md); margin-bottom:12px; object-fit:cover; background:#f0f3f8; }
.site-icon-wrap { width:80%; max-width:100%; aspect-ratio:1/1; border-radius:var(--radius-md); margin-bottom:12px; display:flex; align-items:center; justify-content:center; background:#f0f3f8; overflow:hidden; }
.site-icon-wrap img { width:100%; height:100%; object-fit:cover; border-radius:var(--radius-md); }
.site-ph { font-size:1.5rem; font-weight:700; color:var(--primary); }
.online-name { font-size:.76rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.online-desc { font-size:.6rem; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 弹幕 */
#danmu-panel .danmu-item.hidden { display:none !important; }

/* 更多 */
#more-panel { overflow-x:hidden; width:100%; }
#more-content { width:100%; overflow-x:hidden; }
#more-content.has-sidebar { display:flex; flex-direction:row; gap:12px; align-items:flex-start; }
.more-group { display:none; width:100%; }
.more-group.active { display:block; }
.online-list { display:flex; flex-direction:column; gap:10px; width:100%; }
.online-item {
  display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--border-light);
  border-radius:10px; padding:12px 14px; text-decoration:none; color:inherit;
  transition:border-color .15s, box-shadow .15s; min-width:0; width:100%;
}
.online-item:active { border-color:var(--primary); box-shadow:0 2px 8px rgba(74,158,255,.15); }
.online-item-icon { flex-shrink:0; width:48px; height:48px; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#f0f3f8; }
.online-item-icon img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
.online-item-icon .site-ph { font-size:1.2rem; font-weight:700; color:var(--primary); }
.online-item-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.online-item-name { font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.online-item-desc { font-size:.68rem; color:var(--text-muted); margin-top:3px; line-height:1.4; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* 关于 */
.about-card { background:#f8fafc; border-radius:var(--radius-md); padding:16px 18px; margin-bottom:14px; border:1px solid var(--border-light); }
.about-card h3 { font-size:.9rem; margin-bottom:10px; }
.about-card p, .about-card li { font-size:.75rem; line-height:1.7; }
.about-domain-line { display:flex; align-items:center; gap:8px; padding:6px 14px; background:#fff; border-radius:var(--radius-full); border:1px solid #e0e6ed; margin-top:8px; }
.about-domain-line span { flex:1; font-size:.75rem; color:var(--primary); }
.contributors-note { font-size:.68rem; color:var(--text-muted); margin-top:10px; line-height:1.5; font-style:italic; }
.contributor-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px; }
.contributor-card { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.6); border-radius:12px; padding:12px 14px; }
.contributor-card.hidden { display:none !important; }
.contributor-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.85rem; }
.contributor-info { flex:1; min-width:0; }
.contributor-name { font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.contributor-role { display:inline-block; margin-top:4px; font-size:.6rem; font-weight:500; color:var(--primary); background:#e8f2ff; padding:2px 10px; border-radius:var(--radius-full); }
.contributor-desc { margin-top:6px; font-size:.68rem; color:var(--text-muted); line-height:1.4; }
.contributor-social { margin-top:6px; font-size:.68rem; color:var(--primary); }

/* 响应式 */
@media (min-width:600px) { .online-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; } .contributor-grid { grid-template-columns:repeat(3,1fr); } }
@media (min-width:960px) { .contributor-grid { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
@media (min-width:1100px) { .online-list { grid-template-columns:repeat(2, 1fr); } }
@media (max-width:600px) {
  body { padding:14px 8px 6px; }
  #modeToggleBtn { top:10px; left:6px; width:48px; font-size:.52rem; padding:4px 2px; }
  .main-card { padding:14px 14px 12px; }
  .header-block { padding-top:10px; margin-bottom:12px; }
  h1 { font-size:1.15rem; }
  h1 .header-logo { width:1.7rem; height:1.7rem; vertical-align:-.4rem; }
  .nav-tabs { gap:4px; margin-bottom:10px; justify-content:space-between; }
  .nav-tab { flex:1; text-align:center; padding:4px 0; font-size:.95rem; border-radius:24px; }
  .api-item, .live-item { padding:12px 0; }
  .api-item-name, .live-item-name { font-size:.92rem; }
  .url-line { padding:6px 10px; gap:6px; }
  .url-tag, .live-url-tag { font-size:.62rem; padding:2px 10px; }
  .url-text, .live-url-text { font-size:.72rem; }
  .copy-btn { font-size:.62rem; padding:0 10px; height:24px; }
  .live-top-aggregate { padding:14px 16px; }
  .live-url-line { padding:8px 10px; }
  .live-url-body .live-url-tag { font-size:.62rem; padding:2px 10px; }
  .live-url-body .live-url-text { font-size:.72rem; }
  .live-info-inline { font-size:.6rem; }
  .contributor-grid { grid-template-columns:repeat(2,1fr) !important; gap:8px; }
  .contributor-card { padding:8px 10px; }
  .contributor-avatar { width:36px; height:36px; font-size:.75rem; }
  .contributor-name { font-size:.78rem; }
  .contributor-role { font-size:.58rem; padding:2px 8px; }
  .contributor-desc { font-size:.65rem; line-height:1.35; }
  #more-content.has-sidebar { gap:8px; }
  #more-content .dl-sidebar { width:72px; gap:6px; max-height:66vh; }
  #more-content .dl-side-btn { padding:9px 3px; font-size:.66rem; border-radius:10px; }
  #more-content .dl-side-btn .dl-side-icon { font-size:.95rem; }
  #downloads-content.has-sidebar { gap:8px; }
  .dl-sidebar { width:72px; gap:6px; max-height:66vh; }
  .dl-side-btn { padding:9px 3px; font-size:.66rem; border-radius:10px; }
  .dl-side-btn .dl-side-icon { font-size:.95rem; }
  .dl-cards { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
}
</style>
</head>

<body class="simple-mode">

<div class="container">
  <button id="modeToggleBtn"></button>

  <div class="header-block">
    <h1><img class="header-logo" id="header-logo" src="" alt="Logo"><span id="header-title-text"></span></h1>
    <div class="header-divider"></div>
    <p class="subtitle" id="header-subtitle"></p>
  </div>

  <div class="main-card">
    <div class="nav-tabs" id="navTabs"></div>
    <input class="search-box" id="search" type="text" placeholder="">

    <div class="tab-panel active" id="api-panel">
      <div class="api-list" id="listContainer">
        <div class="loading" id="apiLoading"></div>
      </div>
    </div>

    <div class="tab-panel" id="live-panel">
      <div class="live-top-aggregate">
        <h3 id="live-aggregate-title"></h3>
        <div class="domain-line">
          <span id="live-aggregate-url"></span>
          <button class="copy-btn" id="live-aggregate-copy">复制</button>
        </div>
      </div>
      <div class="live-list" id="liveListContainer">
        <div class="loading" id="liveLoading"></div>
      </div>
    </div>

    <div class="tab-panel" id="danmu-panel">
      <div id="danmu-content"><div class="loading"></div></div>
    </div>

    <div class="tab-panel" id="download-panel">
      <div id="downloads-content"><div class="loading"></div></div>
    </div>

    <div class="tab-panel" id="more-panel">
      <div id="more-content"><div class="loading"></div></div>
    </div>

    <div class="tab-panel" id="about-panel">
      <div id="about-backup-domains"></div>
      <div id="about-contributors"></div>
      <div id="about-declaration"></div>
    </div>
  </div>

  <footer class="page-footer" id="page-footer"></footer>
</div>

<script>

/* ============================================================================
   全局状态
   ============================================================================ */

let CONFIG = null;
let rawListText = null;
let rawLiveText = null;
let dlCache = new Map();
let dlCurrentGroup = null;

const MODE_KEY = 'site_mode';
const TAB_KEY = 'current_tab';
let currentMode = localStorage.getItem(MODE_KEY) || 'simple';
let currentTabId = 'api';

document.body.className = currentMode + '-mode';

/* ============================================================================
   配置加载
   ============================================================================ */

async function loadConfig() {
  if (CONFIG) return CONFIG;
  const res = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('config.json 加载失败');
  CONFIG = await res.json();
  applyConfig();
  return CONFIG;
}

/* ============================================================================
   配置 → DOM
   ============================================================================ */

function applyConfig() {
  const c = CONFIG;

  /* 主题色 */
  const t = c.theme || {};
  const root = document.documentElement;
  if (t.primary) root.style.setProperty('--primary', t.primary);
  if (t.primaryDark) root.style.setProperty('--primary-dark', t.primaryDark);
  if (t.success) root.style.setProperty('--success', t.success);
  if (t.warning) root.style.setProperty('--warning', t.warning);
  if (t.danger) root.style.setProperty('--danger', t.danger);
  if (t.bg) root.style.setProperty('--bg', t.bg);
  if (t.cardBg) root.style.setProperty('--card-bg', t.cardBg);
  if (t.textMain) root.style.setProperty('--text-main', t.textMain);
  if (t.textMuted) root.style.setProperty('--text-muted', t.textMuted);

  /* 页面标题 */
  document.getElementById('page-title').textContent = c.site.title;

  /* 头部 */
  document.getElementById('header-logo').src = c.site.logo;
  document.getElementById('header-title-text').textContent = c.site.title;
  document.getElementById('header-subtitle').innerHTML = c.site.subtitle + '<br>QQ交流群：' + c.site.qqGroup;

  /* 切换按钮 */
  document.getElementById('modeToggleBtn').innerHTML = currentMode === 'simple' ? c.modeToggle.simpleText : c.modeToggle.fullText;

  /* 搜索 */
  document.getElementById('search').placeholder = c.search.placeholder;

  /* 直播聚合 */
  document.getElementById('live-aggregate-title').textContent = c.live.aggregateTitle;
  document.getElementById('live-aggregate-url').textContent = c.live.aggregateUrl;
  document.getElementById('live-aggregate-copy').setAttribute('data-url', c.live.aggregateUrl);

  /* 加载文案 */
  document.querySelectorAll('.loading').forEach(el => { if (!el.textContent.trim()) el.textContent = c.loadingText; });

  /* 关于 */
  renderAboutPanel();

  /* 页脚 */
  document.getElementById('page-footer').textContent = c.footer;

  /* 导航 */
  renderTabs();
}

function renderTabs() {
  const nav = document.getElementById('navTabs');
  nav.innerHTML = (CONFIG.tabs || []).map(t =>
    `<button class="nav-tab ${t.id === currentTabId ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  nav.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      nav.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTabId = tab.getAttribute('data-tab');
      localStorage.setItem(TAB_KEY, currentTabId);
      showPanel(currentTabId);
    });
  });
}

function renderAboutPanel() {
  const c = CONFIG.about;

  let domainsHtml = `<div class="about-card"><h3>🌐 备份线路域名</h3><p>${c.backupDomains.length} 个域名互为备份，任一个可用：</p>`;
  c.backupDomains.forEach(d => {
    domainsHtml += `<div class="about-domain-line"><span>${d}</span><button class="copy-btn" data-url="${d}">复制</button></div>`;
  });
  domainsHtml += `</div>`;
  document.getElementById('about-backup-domains').innerHTML = domainsHtml;

  let contribHtml = `<div class="about-card"><h3>${c.contributorsTitle}</h3><p>${c.contributorsDesc}</p><div class="contributor-grid" id="contributors-list">`;
  if (c.contributors.length) {
    c.contributors.forEach(co => {
      const init = (co.name || '?').slice(0, 1).toUpperCase();
      contribHtml += `<div class="contributor-card" data-name="${(co.name||'').toLowerCase()}">`;
      if (co.avatar) {
        contribHtml += `<img class="contributor-avatar" src="${co.avatar}" alt="${co.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="contributor-avatar" style="display:none">${init}</div>`;
      } else {
        contribHtml += `<div class="contributor-avatar">${init}</div>`;
      }
      contribHtml += `<div class="contributor-info"><div class="contributor-name">${co.name}</div>`;
      if (co.role) contribHtml += `<div class="contributor-role">${co.role}</div>`;
      if (co.desc) contribHtml += `<div class="contributor-desc">${co.desc}</div>`;
      if (co.social) contribHtml += `<div class="contributor-social">${co.social}</div>`;
      contribHtml += `</div></div>`;
    });
  } else {
    contribHtml += '<div class="error-msg">暂无合作共创人员</div>';
  }
  contribHtml += `</div><p class="contributors-note">${c.contributorsNote}</p></div>`;
  document.getElementById('about-contributors').innerHTML = contribHtml;

  document.getElementById('about-declaration').innerHTML = `<div class="about-card"><h3>${c.declarationTitle}</h3><ul><li>${c.declarationText}</li></ul><p>QQ 交流群：<a href="${c.contact.qqGroupLink}" target="_blank">${c.contact.qqGroup}</a></p><p>Telegram群组：<a href="${c.contact.telegram}" target="_blank">${c.contact.telegram}</a></p><p>项目地址：<a href="${c.contact.github}" target="_blank">${c.contact.github}</a></p></div>`;
}

/* ============================================================================
   工具函数
   ============================================================================ */

function formatDate(d) { if (!d || d.length !== 8) return '----'; return d.slice(0,4)+'年'+d.slice(4,6)+'月'+d.slice(6,8)+'日'; }
function isRecent(d) { if (!d || d.length !== 8) return false; const y=parseInt(d.slice(0,4)),m=parseInt(d.slice(4,6))-1,day=parseInt(d.slice(6,8)); return (Date.now()-new Date(y,m,day).getTime())/86400000 <= 2; }
function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ============================================================================
   全局复制
   ============================================================================ */

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const url = btn.getAttribute('data-url'); if (!url) return;
  const done = () => {
    const orig = btn.textContent; btn.textContent='✅ 已复制'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fb);
  } else { fb(); }
  function fb() {
    const input = document.createElement('input'); input.value=url; input.style.position='fixed'; input.style.opacity='0';
    document.body.appendChild(input); input.focus(); input.select();
    try { document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(input); done();
  }
});

/* ============================================================================
   搜索
   ============================================================================ */

document.getElementById('search').addEventListener('input', function() {
  const kw = (this.value || '').toLowerCase().trim();
  document.querySelectorAll('#api-panel .api-item').forEach(el => { const n = el.getAttribute('data-name')||''; el.classList.toggle('hidden', !n.includes(kw)); });
  document.querySelectorAll('#live-panel .live-item').forEach(el => { const n = el.getAttribute('data-name')||''; el.classList.toggle('hidden', !n.includes(kw)); });
  if (currentMode !== 'simple') {
    document.querySelectorAll('.download-card').forEach(el => { const n = el.getAttribute('data-name')||''; el.classList.toggle('hidden', !n.includes(kw)); });
    document.querySelectorAll('#danmu-panel .danmu-item').forEach(el => { const n = el.getAttribute('data-name')||''; el.classList.toggle('hidden', !n.includes(kw)); });
    document.querySelectorAll('.contributor-card').forEach(el => { const n = el.getAttribute('data-name')||''; el.classList.toggle('hidden', !n.includes(kw)); });
  }
});

/* ============================================================================
   模式切换
   ============================================================================ */

document.getElementById('modeToggleBtn').addEventListener('click', () => {
  currentMode = currentMode === 'simple' ? 'full' : 'simple';
  localStorage.setItem(MODE_KEY, currentMode);
  document.body.className = currentMode + '-mode';
  document.getElementById('modeToggleBtn').innerHTML = currentMode === 'simple' ? CONFIG.modeToggle.simpleText : CONFIG.modeToggle.fullText;
  if (currentMode === 'simple') {
    currentTabId = 'api';
    localStorage.setItem(TAB_KEY, 'api');
    document.getElementById('search').style.display = '';
    renderApi();
  } else {
    renderTabs();
    showPanel(currentTabId);
  }
});

/* ============================================================================
   面板切换
   ============================================================================ */

function showPanel(tabId) {
  document.getElementById('search').value = '';
  document.querySelectorAll('#api-panel .api-item.hidden').forEach(e => e.classList.remove('hidden'));
  document.querySelectorAll('#live-panel .live-item.hidden').forEach(e => e.classList.remove('hidden'));
  document.querySelectorAll('.download-card.hidden').forEach(e => e.classList.remove('hidden'));
  document.querySelectorAll('#danmu-panel .danmu-item.hidden').forEach(e => e.classList.remove('hidden'));
  document.querySelectorAll('.contributor-card.hidden').forEach(e => e.classList.remove('hidden'));

  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(tabId + '-panel'); if (panel) panel.classList.add('active');

  const hideSearch = ['danmu','download','more','about'];
  document.getElementById('search').style.display = hideSearch.includes(tabId) ? 'none' : '';

  if (tabId === 'api') renderApi();
  if (tabId === 'live') renderLiveList();
  if (tabId === 'download') renderDownloads();
  if (tabId === 'danmu') renderDanmu();
  if (tabId === 'more') renderMore();
}

/* ============================================================================
   点播
   ============================================================================ */

async function renderApi() {
  const container = document.getElementById('listContainer');
  try {
    if (rawListText === null) {
      const res = await fetch(CONFIG.api.listFile + '?t=' + Date.now(), { cache:'no-store' });
      rawListText = await res.text();
    }
    const tip = document.getElementById('apiLoading'); if (tip) tip.style.display = 'none';
    const text = rawListText;
    const lines = text.trim().split('\n').filter(l => l.trim());
    const weights = CONFIG.api.weights || {};
    const domains = CONFIG.api.domains || [];
    const rotateKw = CONFIG.api.rotateKeywords || [];
    let items = lines.map(line => {
      const p = line.split('|').map(s => s.trim()); if (!p[0]) return null;
      return { file:p[0], name:p[0].replace(/\.json$/i,''), date:p[1]||'', size:p[2]||'', origUrl:p[3]||'', weight:weights.hasOwnProperty(p[0])?weights[p[0]]:999 };
    }).filter(Boolean);

    const ri = items.filter(i => rotateKw.some(kw => i.name.toLowerCase().includes(kw.toLowerCase())));
    if (ri.length) {
      const top = ri[Math.abs(Math.floor(Math.sin(Date.now())*10000))%ri.length];
      if (top) top.weight = Number.MIN_SAFE_INTEGER;
    }
    items.sort((a,b) => a.weight - b.weight);

    let html = '';
    items.forEach(it => {
      const isNew = isRecent(it.date); let lines2 = '';
      if (it.origUrl) lines2 += `<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`;
      domains.forEach(d => { const u = d.base + it.name + '.json'; lines2 += `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${u}</span><button class="copy-btn" data-url="${u}">复制</button></div>`; });
      html += `<div class="api-item" data-name="${it.name.toLowerCase()}"><div class="api-item-header"><div class="api-item-name" title="${it.name}">${it.name}</div><div class="api-item-meta"><span class="${isNew?'badge-new':'badge-old'}">备份时间 ${formatDate(it.date)}</span>${it.size?'&nbsp;&nbsp;'+it.size:''}</div></div><div class="api-item-urls">${lines2}</div></div>`;
    });
    container.innerHTML = html;
  } catch(e) {
    const tip = document.getElementById('apiLoading'); if (tip) tip.style.display = 'none';
    container.innerHTML = `<div class="error-msg">${CONFIG.errorText}：${e.message}</div>`;
  }
}

/* ============================================================================
   直播
   ============================================================================ */

async function renderLiveList() {
  const container = document.getElementById('liveListContainer');
  const loading = document.getElementById('liveLoading');
  try {
    if (rawLiveText === null) {
      const res = await fetch(CONFIG.live.listFile + '?t=' + Date.now(), { cache:'no-store' });
      rawLiveText = await res.text();
    }
    if (loading) loading.style.display = 'none';
    const lines = rawLiveText.trim().split('\n').filter(l => l.trim());
    const domains = CONFIG.live.domains || [];
    let html = '';
    lines.forEach(line => {
      const p = line.split('|').map(s => s.trim()); if (!p[0]) return;
      const name = p[0], displayName = p[0].replace(/\.[^.]+$/,'');
      const date = p[1]||'', size = p[2]||'', origUrl = p[3]||'', source = p[4]||'', ua = p[5]||'';
      const isNew = isRecent(date); let urls = '';
      if (origUrl) urls += `<div class="live-url-line"><div class="live-info-inline"><span>来源：${source||'未知'}</span>${ua?'<span class="sep">|</span><span>UA：'+ua+'</span>':''}</div><div class="live-url-body"><span class="live-url-tag">原始线路</span><span class="live-url-text">${origUrl}</span><button class="copy-btn" data-url="${origUrl}">复制</button></div></div>`;
      domains.forEach(d => { const u = d.base + name; urls += `<div class="live-url-line"><div class="live-url-body"><span class="live-url-tag">${d.tag}</span><span class="live-url-text">${u}</span><button class="copy-btn" data-url="${u}">复制</button></div></div>`; });
      html += `<div class="live-item" data-name="${displayName.toLowerCase()}"><div class="live-item-header"><div class="live-item-name" title="${displayName}">${displayName}</div><div class="live-item-meta"><span class="${isNew?'live-badge-new':'live-badge-old'}">备份时间 ${formatDate(date)}</span>${size?'&nbsp;&nbsp;'+size:''}</div></div><div class="live-item-urls">${urls}</div></div>`;
    });
    container.innerHTML = html || `<div class="error-msg">⚠️ 直播列表为空</div>`;
  } catch(e) {
    if (loading) loading.style.display = 'none';
    container.innerHTML = `<div class="error-msg">${CONFIG.errorText}：${e.message}</div>`;
  }
}

/* ============================================================================
   下载
   ============================================================================ */

async function renderDownloads() {
  const container = document.getElementById('downloads-content');
  if (!container || container.dataset.rendered) return;
  container.dataset.rendered = 'true';
  container.className = 'has-sidebar';
  container.innerHTML = `<div class="dl-sidebar" id="dlSidebar"></div><div class="dl-body" id="dlBody"><div class="loading">${CONFIG.loadingText}</div></div>`;

  const sources = CONFIG.downloadSources || [];
  const sidebar = document.getElementById('dlSidebar');
  sidebar.innerHTML = sources.map((src, i) => {
    const icon = src.icon ? `<img src="${src.icon}" style="width:1.4rem;height:1.4rem;border-radius:6px;object-fit:cover">` : `<span class="dl-side-icon">📦</span>`;
    return `<button class="dl-side-btn ${i===0?'active':''}" data-key="${src.url}">${icon}<span>${src.name||('组'+(i+1))}</span></button>`;
  }).join('');
  sidebar.querySelectorAll('.dl-side-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      sidebar.querySelectorAll('.dl-side-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showDownloadGroup(btn.getAttribute('data-key'));
    });
  });

  await Promise.all(sources.map(async src => {
    if (dlCache.has(src.url)) return;
    try {
      const res = await fetch(src.url + '?t=' + Date.now(), { cache:'no-store' });
      const raw = await res.text();
      const cleaned = raw.replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/：/g,':').replace(/，/g,',');
      const data = JSON.parse(cleaned);
      let cards = [];
      const arr = data.list || data;
      if (Array.isArray(arr)) { arr.forEach(g => { if (g && Array.isArray(g.list)) g.list.forEach(i => cards.push(i)); else cards.push(g); }); }
      dlCache.set(src.url, { src, cards });
    } catch(e) { dlCache.set(src.url, { src, cards:[], error:e.message }); }
  }));

  showDownloadGroup(sources[0].url);
}

function showDownloadGroup(key) {
  dlCurrentGroup = key;
  const body = document.getElementById('dlBody'); if (!body) return;
  const entry = dlCache.get(key);
  if (!entry) { body.innerHTML = `<div class="loading">${CONFIG.loadingText}</div>`; return; }
  const { src, cards, error } = entry;
  if (error) { body.innerHTML = `<div class="error-msg">${CONFIG.errorText}：${error}</div>`; return; }
  if (!cards.length) { body.innerHTML = `<div class="error-msg">⚠️ ${src.name} 暂无资源</div>`; return; }
  const title = src.name ? `<div class="dl-group-title">${src.name}</div>` : '';
  const desc = src.description ? `<div class="dl-group-desc">${src.description}</div>` : '';
  const cardsHtml = cards.map(i => `
    <a class="download-card" href="${i.url||'#'}" target="_blank" rel="noopener noreferrer" data-name="${(i.name||'').toLowerCase()}">
      <img src="${i.icon||''}" onerror="this.style.visibility='hidden'" style="width:90%;max-width:100%;height:auto;aspect-ratio:1/1;border-radius:10px;margin-bottom:14px;object-fit:cover;background:#f0f3f8;">
      <div style="flex:1;width:100%;margin-top:auto"><div style="font-size:.76rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.name||''}</div>${i.version?`<div style="font-size:.6rem;color:var(--text-muted);margin-top:2px">${i.version}</div>`:''}</div>
    </a>`).join('');
  body.innerHTML = `<div class="dl-group active">${title}${desc}<div class="dl-cards">${cardsHtml}</div></div>`;
}

/* ============================================================================
   弹幕
   ============================================================================ */

function renderDanmu() {
  const container = document.getElementById('danmu-content'); if (!container) return;
  const sources = CONFIG.danmuSources || [];
  if (!sources.length) { container.innerHTML = '<div class="error-msg">⚠️ 未配置弹幕源</div>'; return; }
  let rows = '';
  sources.forEach(s => { rows += `<div class="danmu-item" data-name="${s.name.toLowerCase()}" style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-radius:var(--radius-full);border:1px solid #e0e6ed;margin-top:8px"><span style="flex:0 0 auto;font-size:.78rem;font-weight:600">${s.name}</span><span style="flex:1;font-size:.75rem;color:var(--primary);word-break:break-all">${s.url}</span><button class="copy-btn" data-url="${s.url}">复制</button></div>`; });
  container.innerHTML = `<div class="about-card"><h3>💬 弹幕接口</h3><p style="font-size:.76rem;color:var(--text-muted);margin-bottom:4px">${CONFIG.danmuTutorial||''}</p>${rows}</div>`;
}

/* ============================================================================
   更多
   ============================================================================ */

async function renderMore() {
  const container = document.getElementById('more-content'); if (!container || container.dataset.rendered) return;
  container.dataset.rendered = 'true';
  container.className = 'has-sidebar';
  container.innerHTML = `<div class="loading">${CONFIG.loadingText}</div>`;

  const tabs = CONFIG.moreTabs || [];
  const paths = CONFIG.moreData || {};
  if (!tabs.length) { container.innerHTML = '<div class="error-msg">⚠️ 未配置更多面板</div>'; return; }

  const sidebarHtml = tabs.map((t, i) => `<button class="dl-side-btn${i===0?' active':''}" data-more-tab="${t.id}"><span class="dl-side-icon">${t.icon}</span><span>${t.label}</span></button>`).join('\n');
  const panelMap = {};
  await Promise.all(tabs.map(async t => {
    const p = paths[t.id]; if (!p) { panelMap[t.id] = null; return; }
    try { const res = await fetch(p + '?t=' + Date.now(), { cache:'no-store' }); panelMap[t.id] = await res.json(); }
    catch(e) { panelMap[t.id] = null; }
  }));

  const bodyHtml = tabs.map((t, i) => {
    const data = panelMap[t.id];
    if (!data) return `<div class="more-group${i===0?' active':''}" id="more-${t.id}"><div class="error-msg">⚠️ ${t.label} 加载失败</div></div>`;
    const isOnline = t.id === 'onlineVideo';
    let itemsHtml = '';
    (data.items || data).forEach(item => {
      if (isOnline) {
        const host = (item.url.match(/https?:\/\/([^/]+)/)||[, ''])[1];
        const ph = item.name.charAt(0);
        itemsHtml += `<a class="online-item" href="${item.url}" target="_blank" rel="noopener noreferrer"><span class="online-item-icon"><img src="https://favicon.im/${host}?larger=true" alt="${item.name}" loading="lazy" onerror="this.onerror=null;this.src='https://icon.horse/icon/${host}';this.addEventListener('error',()=>{this.style.display='none';this.nextElementSibling.style.display='flex';},{once:true})"><span class="site-ph" style="display:none">${ph}</span></span><div class="online-item-info"><div class="online-item-name">${item.name}</div><div class="online-item-desc">${item.desc}</div></div></a>`;
      } else {
        itemsHtml += `<div class="api-item" data-name="${item.name.toLowerCase()}"><div class="api-item-header"><div class="api-item-name" title="${item.name}">${item.name}</div><div class="api-item-meta"><span class="badge-new">${item.badge||''}</span></div></div><div class="api-item-urls"><div class="url-line"><span class="url-tag">${item.tag||'导入'}</span><span class="url-text">${item.url}</span><button class="copy-btn" data-url="${item.url}">复制</button></div></div>${item.note?`<div style="font-size:.68rem;color:var(--text-muted);margin-top:6px">${item.note}</div>`:''}</div>`;
      }
    });
    const wrapClass = isOnline ? 'online-list' : 'api-list';
    return `<div class="more-group${i===0?' active':''}" id="more-${t.id}"><div class="about-card"><h3>${data.title||t.label}</h3><p style="font-size:.76rem;color:var(--text-muted);margin-bottom:4px">${data.description||''}</p><div class="${wrapClass}">${itemsHtml}</div></div></div>`;
  }).join('\n');

  container.innerHTML = `<div class="dl-sidebar" id="moreSidebar">${sidebarHtml}</div><div class="dl-body" id="moreBody">${bodyHtml}</div>`;
  document.querySelectorAll('#moreSidebar .dl-side-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#moreSidebar .dl-side-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.more-group').forEach(g => g.classList.remove('active'));
      const target = document.getElementById('more-' + btn.getAttribute('data-more-tab'));
      if (target) target.classList.add('active');
    });
  });
}

/* ============================================================================
   初始化
   ============================================================================ */

loadConfig().then(() => {
  if (currentMode === 'simple') {
    currentTabId = 'api';
    localStorage.setItem(TAB_KEY, 'api');
    renderApi();
  } else {
    showPanel(currentTabId);
  }
});
