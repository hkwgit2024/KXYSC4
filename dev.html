<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>🛠 调试模式 - 海量接口搬运备份</title>
<style>
/* ===== 调试模式标识 ===== */
body.dev-mode::before {
  content: "🛠 DEV MODE";
  position: fixed; top: 0; right: 0;
  background: #f59e0b; color: #fff;
  font-size: .6rem; font-weight: 700;
  padding: 2px 12px; border-bottom-left-radius: 6px; z-index: 9999;
}

/* ===== 全局 ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
}
.container { max-width:820px; margin:0 auto; position:relative; flex:1; display:flex; flex-direction:column; width:100%; }

/* ===== 模式切换 ===== */
#modeToggleBtn {
  position:absolute; top:14px; left:10px; z-index:999;
  width:56px; padding:6px 4px; border-radius:50px;
  border:1px solid #4a9eff; background:#fff; color:#4a9eff;
  font-size:.58rem; line-height:1.3; text-align:center; cursor:pointer;
}

/* ===== 标题 ===== */
.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }
h1 { font-size:1.35rem; font-weight:700; color:#0a1a2b; }

/* ===== 搜索 ===== */
.search-box {
  width:100%; padding:10px 16px; border:1px solid #d4dbe5;
  border-radius:50px; font-size:.92rem; background:#fff; outline:none; margin-bottom:14px;
}

/* ===== 主卡片 ===== */
.main-card {
  background:#fff; border-radius:8px; padding:20px 22px 18px;
  border:1px solid #d4dbe5; flex:1; display:flex; flex-direction:column; overflow-x:hidden; width:100%;
}

/* ===== 导航 ===== */
.nav-tabs { display:flex; gap:10px; margin-bottom:16px; justify-content:center; flex-wrap:wrap; }
.nav-tab {
  padding:7px 24px; border:1.5px solid #4a9eff; border-radius:40px;
  background:#fff; color:#4a9eff; font-size:.82rem; font-weight:500; cursor:pointer; white-space:nowrap;
}
.nav-tab.active { background:#4a9eff; color:#fff; }

/* ===== 面板 ===== */
.tab-panel { display:none; width:100%; }
.tab-panel.active { display:block; }

/* ===== 列表项 ===== */
.api-item { padding:14px 0; border-bottom:1px solid #e4ebf3; }
.api-item:last-child { border-bottom:none; }
.api-item-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.api-item-name { font-size:1rem; font-weight:700; flex:1; min-width:0; }
.url-line {
  display:flex; align-items:center; gap:8px; padding:6px 14px;
  background:#f4f8fc; border:1px solid #e0e8f0; border-radius:50px; min-width:0;
}
.url-text { font-size:.78rem; color:#2563eb; word-break:break-all; flex:1; min-width:0; }
.copy-btn {
  flex-shrink:0; background:#4a9eff; color:#fff; border:none; border-radius:30px;
  padding:0 14px; font-size:.7rem; cursor:pointer; height:26px;
}
.copy-btn.copied { background:#3b9b6c; }

/* ===== 空壳 ===== */
.dev-shell {
  border: 2px dashed #f59e0b; border-radius: 8px;
  background: #fffbeb; min-height: 150px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #d97706; font-size: .85rem; text-align: center; padding: 20px; margin-top: 8px;
}
.dev-shell .dev-icon { font-size: 2rem; margin-bottom: 8px; }
.dev-shell .dev-hint { font-size: .7rem; color: #9ca3af; margin-top: 6px; }

/* ===== 加载/错误 ===== */
.loading { text-align:center; color:#8fa3b8; padding:60px 0; font-size:.88rem; }
.error-msg { text-align:center; color:#dc2626; padding:16px; font-size:.8rem; background:#fef2f2; border:1px solid #fecaca; border-radius:4px; margin:12px 0; }

/* ===== footer ===== */
.page-footer { text-align:center; padding:24px 0 10px; font-size:.7rem; color:#8fa3b8; line-height:1.8; }

/* ===== 隐藏 ===== */
.hidden { display:none !important; }
</style>
</head>

<body class="full-mode dev-mode">

<div class="container">
  <button id="modeToggleBtn">调试<br>模式</button>

  <!-- 标题 -->
  <div class="header-block">
    <h1>🛠 调试 - 海量接口搬运备份</h1>
    <p style="font-size:.78rem;color:#7a8fa3;margin-top:6px">单文件测试 · 全能版骨架 · 点播有真实数据</p>
  </div>

  <!-- 搜索 -->
  <input class="search-box" id="search" type="text" placeholder="🔍 搜索..." oninput="globalSearch()">

  <!-- 主卡片 -->
  <div class="main-card">

    <!-- 导航栏 -->
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="api" onclick="showPanel('api')">点播</button>
      <button class="nav-tab" data-tab="live" onclick="showPanel('live')">直播</button>
      <button class="nav-tab" data-tab="danmu" onclick="showPanel('danmu')">弹幕</button>
      <button class="nav-tab" data-tab="download" onclick="showPanel('download')">下载</button>
      <button class="nav-tab" data-tab="about" onclick="showPanel('about')">关于</button>
    </div>

    <!-- ===== 点播面板（真实内容） ===== -->
    <div class="tab-panel active" id="api-panel">
      <div class="api-list" id="listContainer">
        <div class="loading">⏳ 正在加载接口列表...</div>
      </div>
    </div>

    <!-- ===== 直播面板（空壳） ===== -->
    <div class="tab-panel" id="live-panel">
      <div class="dev-shell">
        <div class="dev-icon">📺</div>
        <div><strong>直播面板</strong> — 开发中</div>
        <div class="dev-hint">在此写逻辑，跑通后搬到 modules/live-list.html</div>
        <button class="copy-btn" style="margin-top:12px" onclick="showPanel('danmu')">→ 下一个：弹幕</button>
      </div>
    </div>

    <!-- ===== 弹幕面板（空壳） ===== -->
    <div class="tab-panel" id="danmu-panel">
      <div class="dev-shell">
        <div class="dev-icon">💬</div>
        <div><strong>弹幕面板</strong> — 开发中</div>
        <div class="dev-hint">在此写逻辑，跑通后搬到 modules/danmu.html</div>
        <button class="copy-btn" style="margin-top:12px" onclick="showPanel('download')">→ 下一个：下载</button>
      </div>
    </div>

    <!-- ===== 下载面板（空壳） ===== -->
    <div class="tab-panel" id="download-panel">
      <div class="dev-shell">
        <div class="dev-icon">📦</div>
        <div><strong>下载面板</strong> — 开发中</div>
        <div class="dev-hint">在此写逻辑，跑通后搬到 modules/download.html</div>
        <button class="copy-btn" style="margin-top:12px" onclick="showPanel('about')">→ 下一个：关于</button>
      </div>
    </div>

    <!-- ===== 关于面板（空壳） ===== -->
    <div class="tab-panel" id="about-panel">
      <div class="dev-shell">
        <div class="dev-icon">ℹ️</div>
        <div><strong>关于面板</strong> — 开发中</div>
        <div class="dev-hint">在此写逻辑，跑通后搬到 modules/about.html</div>
        <button class="copy-btn" style="margin-top:12px" onclick="showPanel('api')">→ 回到：点播</button>
      </div>
    </div>

  </div>

  <!-- footer -->
  <footer class="page-footer">
    <p>🛠 调试模式 · 快捷键 1-5 切换面板 · 点播面板加载真实数据用于跑通公共代码</p>
  </footer>
</div>

<script>
/* ===== 面板切换 ===== */
function showPanel(tabId) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId + '-panel').classList.add('active');
  document.querySelector(`.nav-tab[data-tab="${tabId}"]`)?.classList.add('active');
  console.log(`📋 面板切换 → ${tabId}`);
}

/* ===== 搜索 ===== */
function globalSearch() {
  const kw = document.getElementById('search').value.toLowerCase().trim();
  document.querySelectorAll('.api-item').forEach(el => {
    const n = el.dataset.name || '';
    el.classList.toggle('hidden', !n.includes(kw));
  });
}

/* ===== 复制 ===== */
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const url = btn.dataset.url;
  if (!url) return;
  const done = () => {
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(fb);
  else fb();
  function fb() {
    const i = document.createElement('input'); i.value = url;
    document.body.appendChild(i); i.select(); document.execCommand('copy');
    document.body.removeChild(i); done();
  }
});

/* ===== 快捷键 1-5 ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const map = { '1': 'api', '2': 'live', '3': 'danmu', '4': 'download', '5': 'about' };
  if (map[e.key]) showPanel(map[e.key]);
});

/* ===== 点播列表加载（真实数据） ===== */
(async () => {
  const c = document.getElementById('listContainer');
  try {
    const res = await fetch('list.txt?t=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    const items = text.trim().split('\n').filter(l => l.trim()).map(line => {
      const p = line.split('|').map(s => s.trim());
      return { file: p[0], name: p[0]?.replace(/\.json$/i, ''), date: p[1], size: p[2], origUrl: p[3] };
    });
    c.innerHTML = items.map(it => `
      <div class="api-item" data-name="${(it.name || '').toLowerCase()}">
        <div class="api-item-header">
          <div class="api-item-name">${it.name}</div>
          <div style="font-size:.72rem;color:#8fa3b8;white-space:nowrap">${it.date || ''}</div>
        </div>
        ${it.origUrl ? `<div class="url-line"><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>` : ''}
      </div>
    `).join('');
    console.log(`✅ 点播列表加载完成，${items.length} 条`);
  } catch (e) {
    c.innerHTML = '<div class="error-msg">❌ 加载失败：' + e.message + '</div>';
    console.error('❌ 点播列表加载失败', e);
  }
})();

/* ===== 模式切换按钮（调试页固定提示） ===== */
document.getElementById('modeToggleBtn').addEventListener('click', () => {
  alert('🛠 调试模式固定全能版\n去 index.html 测试简洁/全能切换');
});

console.log('%c🛠 调试页已启动', 'color:#f59e0b;font-size:14px;font-weight:bold');
console.log('%c快捷键：1=点播 2=直播 3=弹幕 4=下载 5=关于', 'color:#6b7280;font-size:11px');
</script>
</body>
</html>
