<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>
<style>
/* ============================================================
   公共 CSS（完整内联，与原项目一致）
   ============================================================ */

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px; min-height:100vh;
  display:flex; flex-direction:column; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button:focus, button:focus-visible, input:focus, input:focus-visible,
.nav-tab:focus, .copy-btn:focus { outline:none !important; }

.container {
  max-width:820px; margin:0 auto; position:relative;
  flex:1; display:flex; flex-direction:column; width:100%; overflow-x:hidden;
}

/* 模式切换 */
#modeToggleBtn {
  position:absolute; top:14px; left:10px; z-index:999;
  width:56px; padding:6px 4px; border-radius:50px;
  border:1px solid #4a9eff; background:#fff; color:#4a9eff;
  font-size:.58rem; line-height:1.3; text-align:center; cursor:pointer;
}

/* 标题 */
.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }
h1 { font-size:1.35rem; font-weight:700; color:#0a1a2b; }
h1 .header-logo {
  width:2rem; height:2rem; border-radius:50%; border:1px solid #4a9eff;
  object-fit:cover; vertical-align:-.5rem; margin-right:8px;
}
.header-divider { height:1px; background:#e4ebf3; margin:12px 0; }
.subtitle { font-size:.78rem; color:#7a8fa3; line-height:1.6; }

/* 搜索 */
.search-box {
  width:100%; padding:10px 16px; border:1px solid #d4dbe5;
  border-radius:50px; font-size:.92rem; background:#fff; outline:none; -webkit-appearance:none;
  margin-bottom:14px;
}

/* 主卡片 */
.main-card {
  background:#fff; border-radius:8px; padding:20px 22px 18px;
  border:1px solid #d4dbe5; flex:1; display:flex; flex-direction:column;
  overflow-x:hidden; width:100%;
}

/* 导航 */
.nav-tabs { display:flex; gap:10px; margin-bottom:16px; justify-content:center; flex-wrap:wrap; }
.nav-tab {
  padding:7px 24px; border:1.5px solid #4a9eff; border-radius:40px;
  background:#fff; color:#4a9eff; font-size:.82rem; font-weight:500; cursor:pointer; white-space:nowrap;
}
.nav-tab.active { background:#4a9eff; color:#fff; }
.nav-tab:active { transform:scale(.96); }

/* 面板 */
.tab-panel { display:none; width:100%; }
.tab-panel.active { display:block; }

/* 列表项 */
.api-list { display:flex; flex-direction:column; width:100%; }
.api-item { padding:14px 0; border-bottom:1px solid #e4ebf3; }
.api-item:last-child { border-bottom:none; }
.api-item.hidden { display:none !important; }
.api-item-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.api-item-name { font-size:1rem; font-weight:700; color:#0a1a2b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.api-item-meta { display:flex; align-items:center; gap:8px; font-size:.72rem; white-space:nowrap; flex-shrink:0; }
.url-line {
  display:flex; align-items:center; gap:8px; padding:6px 14px;
  background:#f4f8fc; border:1px solid #e0e8f0; border-radius:50px; min-width:0; margin-top:6px;
}
.url-tag { font-size:.68rem; font-weight:600; color:#3a5a7a; background:#d8e8f8; padding:2px 14px; border-radius:50px; white-space:nowrap; flex-shrink:0; }
.url-text { font-size:.78rem; color:#2563eb; word-break:break-all; overflow-wrap:break-word; line-height:1.4; flex:1; min-width:0; }
.copy-btn {
  flex-shrink:0; background:#4a9eff; color:#fff; border:none; border-radius:30px;
  padding:0 14px; font-size:.7rem; font-weight:500; cursor:pointer; height:26px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, transform .05s; white-space:nowrap; margin-left:auto;
  position:relative; z-index:2; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.copy-btn:active { background:#2a7ed9; transform:scale(.96); }
.copy-btn.copied { background:#3b9b6c; }

/* 加载/错误 */
.loading { text-align:center; color:#8fa3b8; padding:60px 0; font-size:.88rem; }
.error-msg { text-align:center; color:#dc2626; padding:16px 20px; font-size:.8rem; background:#fef2f2; border:1px solid #fecaca; border-radius:4px; margin:12px 0; word-break:break-all; }

/* footer */
.page-footer { text-align:center; padding:24px 0 10px; font-size:.7rem; color:#8fa3b8; line-height:1.8; flex-shrink:0; }

/* ===== 简洁模式 ===== */
body.simple-mode .nav-tabs { display:none !important; }
body.simple-mode #live-panel,
body.simple-mode #download-panel,
body.simple-mode #danmu-panel,
body.simple-mode #about-panel { display:none !important; }
body.simple-mode #api-panel { display:block !important; }
body.simple-mode .search-box { margin-bottom:20px; }

/* ===== 空壳面板（开发中占位，无调试字样） ===== */
.panel-placeholder {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:200px; color:#b0bec5; text-align:center; padding:40px 20px;
}
.panel-placeholder .placeholder-icon { font-size:2.5rem; margin-bottom:12px; opacity:.5; }
.panel-placeholder .placeholder-text { font-size:.85rem; }

/* 移动端 */
@media (max-width:600px) {
  body { padding:14px 8px 6px; }
  #modeToggleBtn { top:10px; left:6px; width:48px; font-size:.52rem; padding:4px 2px; }
  .main-card { padding:14px 14px 12px; }
  .api-item { padding:12px 0; }
  .url-line { padding:6px 10px; gap:6px; }
  .copy-btn { font-size:.62rem; padding:0 10px; height:24px; }
}
</style>
</head>

<body class="full-mode">

<div class="container">
  <button id="modeToggleBtn">切换<br>简洁版</button>

  <!-- 标题 -->
  <div class="header-block">
    <h1><img class="header-logo" src="https://0.12yue.de5.net/tvbox/x/jueson.jpg" alt="Logo">海量接口搬运备份</h1>
    <div class="header-divider"></div>
    <p class="subtitle">备用数据源，防屏不迷路<br>QQ交流群：1067685939</p>
  </div>

  <!-- 搜索 -->
  <input class="search-box" id="search" type="text" placeholder="🔍 搜索..." oninput="globalSearch()">

  <!-- 主卡片 -->
  <div class="main-card">

    <!-- 导航栏 -->
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="api" onclick="showPanel('api')">点播</button>
      <button class="nav-tab" data-tab="live" onclick="showPanel('live')">直播</button>
      <button class="nav-tab" data-tab="danmu" onclick="showPanel('danmu')">弹幕</button>
      <button class="nav-tab" data-tab="download" onclick="showPanel('download')">下载</button>
      <button class="nav-tab" data-tab="about" onclick="showPanel('about')">关于</button>
    </div>

    <!-- 点播面板（真实数据） -->
    <div class="tab-panel active" id="api-panel">
      <div class="api-list" id="listContainer">
        <div class="loading">⏳ 正在加载接口列表...</div>
      </div>
    </div>

    <!-- 直播面板（空壳） -->
    <div class="tab-panel" id="live-panel">
      <div class="panel-placeholder">
        <div class="placeholder-icon">📺</div>
        <div class="placeholder-text">直播内容加载中...</div>
      </div>
    </div>

    <!-- 弹幕面板（空壳） -->
    <div class="tab-panel" id="danmu-panel">
      <div class="panel-placeholder">
        <div class="placeholder-icon">💬</div>
        <div class="placeholder-text">弹幕内容加载中...</div>
      </div>
    </div>

    <!-- 下载面板（空壳） -->
    <div class="tab-panel" id="download-panel">
      <div class="panel-placeholder">
        <div class="placeholder-icon">📦</div>
        <div class="placeholder-text">下载内容加载中...</div>
      </div>
    </div>

    <!-- 关于面板（空壳） -->
    <div class="tab-panel" id="about-panel">
      <div class="panel-placeholder">
        <div class="placeholder-icon">ℹ️</div>
        <div class="placeholder-text">关于内容加载中...</div>
      </div>
    </div>

  </div>

  <!-- footer -->
  <footer class="page-footer">
    <p>本站接口资源由【误道者】整理。所有资源均来自互联网，版权归原作者所有。仅供测试学习使用，请勿用于违法及商业用途，请勿付费购买。如涉及侵权，请联系删除。 QQ 群：1067685939。</p>
  </footer>
</div>

<script>
/* ============================================================
   公共 JS（完整内联）
   ============================================================ */

const MODE_KEY = 'site_mode';

let currentMode = localStorage.getItem(MODE_KEY) || 'full';
let currentTabId = 'api';
document.body.className = currentMode + '-mode';
updateBtnText();

/* 复制 */
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const url = btn.dataset.url;
  if (!url) return;
  const done = () => {
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(fb);
  else fb();
  function fb() {
    const i = document.createElement('input'); i.value = url;
    document.body.appendChild(i); i.select(); document.execCommand('copy');
    document.body.removeChild(i); done();
  }
});

/* 搜索 */
function globalSearch() {
  const kw = document.getElementById('search').value.toLowerCase().trim();
  document.querySelectorAll('.api-item').forEach(el => {
    const n = el.dataset.name || '';
    el.classList.toggle('hidden', !n.includes(kw));
  });
}

/* 面板切换 */
function showPanel(tabId) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId + '-panel').classList.add('active');
  document.querySelector(`.nav-tab[data-tab="${tabId}"]`)?.classList.add('active');
  currentTabId = tabId;
}

/* 模式切换 */
document.getElementById('modeToggleBtn').addEventListener('click', () => {
  currentMode = currentMode === 'simple' ? 'full' : 'simple';
  localStorage.setItem(MODE_KEY, currentMode);
  document.body.className = currentMode + '-mode';
  updateBtnText();
  if (currentMode === 'simple') {
    showPanel('api');
  }
});

function updateBtnText() {
  document.getElementById('modeToggleBtn').innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版';
}

/* ============================================================
   点播列表加载（真实数据）
   ============================================================ */

(async () => {
  const c = document.getElementById('listContainer');
  try {
    const res = await fetch('list.txt?t=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    const items = text.trim().split('\n').filter(l => l.trim()).map(line => {
      const p = line.split('|').map(s => s.trim());
      return { file: p[0], name: p[0]?.replace(/\.json$/i, ''), date: p[1], size: p[2], origUrl: p[3] };
    });
    c.innerHTML = items.map(it => `
      <div class="api-item" data-name="${(it.name || '').toLowerCase()}">
        <div class="api-item-header">
          <div class="api-item-name">${it.name}</div>
          <div class="api-item-meta"><span>备份时间 ${it.date || ''}</span></div>
        </div>
        ${it.origUrl ? `
        <div class="url-line">
          <span class="url-tag">原始</span>
          <span class="url-text">${it.origUrl}</span>
          <button class="copy-btn" data-url="${it.origUrl}">复制</button>
        </div>` : ''}
      </div>
    `).join('');
  } catch (e) {
    c.innerHTML = '<div class="error-msg">❌ 加载失败：' + e.message + '</div>';
  }
})();
</script>
</body>
</html>
