<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1a2b3d;padding:20px 14px 10px;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button:focus,button:focus-visible,input:focus,input:focus-visible{outline:none}
.container{max-width:820px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;position:relative}
.header-block{text-align:center;margin-bottom:16px;padding-top:14px}
h1{font-size:1.35rem;font-weight:700;color:#0a1a2b}
h1 .header-logo{width:2rem;height:2rem;border-radius:50%;border:1px solid #4a9eff;object-fit:cover;vertical-align:-.5rem;margin-right:8px}
.header-divider{height:1px;background:#e4ebf3;margin:12px 0}
.subtitle{font-size:.78rem;color:#7a8fa3;line-height:1.6}
.main-card{background:#fff;border-radius:8px;padding:20px 22px 18px;border:1px solid #d4dbe5;flex:1;overflow-x:hidden;display:flex;flex-direction:column}
.nav-tabs{display:flex;gap:10px;margin-bottom:16px;justify-content:center;width:100%}
.nav-tabs-inner{display:flex;gap:10px;transform-origin:left center;transition:transform .2s}
.nav-tab{padding:7px 24px;border:1.5px solid #4a9eff;border-radius:40px;background:#fff;color:#4a9eff;font-size:.82rem;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.nav-tab.active{background:#4a9eff;color:#fff}
.search-box{width:100%;padding:10px 16px;border:1px solid #d4dbe5;border-radius:50px;font-size:.92rem;background:#fff;margin-bottom:14px;-webkit-appearance:none}
.tab-panel{display:none;width:100%;flex:1}
.tab-panel.active{display:block}
.api-list{display:flex;flex-direction:column}
.api-item{padding:14px 0;border-bottom:1px solid #e4ebf3}
.api-item:last-child{border-bottom:none}
.api-item-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.api-item-name{font-size:1rem;font-weight:700;color:#0a1a2b;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.api-item-meta{font-size:.72rem;white-space:nowrap;flex-shrink:0;display:flex;gap:8px}
.badge-new{color:#16a34a;font-weight:600}
.badge-old{color:#ca8a04;font-weight:600}
.api-item-urls{display:flex;flex-direction:column;gap:6px}
.url-line{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#f4f8fc;border:1px solid #e0e8f0;border-radius:50px;min-width:0}
.url-tag{font-size:.68rem;font-weight:600;color:#3a5a7a;background:#d8e8f8;padding:2px 14px;border-radius:50px;white-space:nowrap;flex-shrink:0}
.url-text{font-size:.78rem;color:#2563eb;word-break:break-all;flex:1;min-width:0}
.copy-btn{flex-shrink:0;background:#4a9eff;color:#fff;border:none;border-radius:30px;padding:0 14px;font-size:.7rem;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.loading{text-align:center;color:#8fa3b8;padding:60px 0;font-size:.88rem}
.empty-panel{width:100%;flex:1;min-height:50vh}
.page-footer{text-align:center;padding:24px 0 10px;font-size:.7rem;color:#8fa3b8;line-height:1.8;margin-top:auto}
@media(max-width:600px){
  body{padding:14px 8px 6px}
  h1{font-size:1.15rem}
  h1 .header-logo{width:1.7rem;height:1.7rem}
}
</style>
</head>
<body>

<div class="container">
  <div class="header-block">
    <h1><img class="header-logo" id="header-logo" src="https://0.12yue.de5.net/tvbox/x/jueson.jpg"><span id="header-title">海量接口搬运备份</span></h1>
    <div class="header-divider"></div>
    <p class="subtitle" id="header-subtitle">备用数据源，防屏不迷路<br>QQ交流群：1067685939</p>
  </div>

  <div class="main-card">
    <div class="nav-tabs" id="navTabs">
      <div class="nav-tabs-inner" id="navTabsInner"></div>
    </div>

    <div class="tab-panel active" id="api-panel">
      <input class="search-box" id="search" placeholder="🔍 搜索..." oninput="globalSearch()">
      <div class="api-list" id="listContainer">
        <div class="loading" id="apiLoading">⏳ 正在加载接口列表...</div>
      </div>
    </div>

    <div class="tab-panel" id="live-panel"><div class="empty-panel"></div></div>
    <div class="tab-panel" id="download-panel"><div class="empty-panel"></div></div>
    <div class="tab-panel" id="danmu-panel"><div class="empty-panel"></div></div>
    <div class="tab-panel" id="more-panel"><div class="empty-panel"></div></div>
    <div class="tab-panel" id="about-panel"><div class="empty-panel"></div></div>
  </div>

  <footer class="page-footer">本站接口资源由【误道者】整理。仅供测试学习使用，请勿用于违法及商业用途。</footer>
</div>

<script>
const TAB_KEY='current_tab';
const VALID_TABS=['api','live','download','danmu','more','about'];
const TAB_LABEL={api:'点播',live:'直播',download:'下载',danmu:'弹幕',more:'更多',about:'关于'};

let currentTabId=VALID_TABS.includes(localStorage.getItem(TAB_KEY))?localStorage.getItem(TAB_KEY):'api';
let rawListText=null;
let topSeed=Date.now();

const API_DOMAINS=[
  {tag:"备份一线",base:"https://0.12yue.de5.net/tvbox/"},
  {tag:"备份二线",base:"https://0.cdz.qzz.io/tvbox/"},
  {tag:"备份三线",base:"https://0.wdzb.eu.cc/tvbox/"}
];
const API_WEIGHTS={
  "轮替占位.json":1,"幸福年年.json":2,"饭太硬.json":4,"肥猫.json":5,
  "摸鱼.json":6,"王二小.json":7,"集多.json":8,"潇洒.json":9,"小米.json":10,
  "嗷呜.json":11,"南风.json":12,"小虎斑.json":13
};
const ROTATE_KEYWORDS=["模糊搜索"];

function scaleNav(){
  const wrap=document.getElementById('navTabs');
  const inner=document.getElementById('navTabsInner');
  const scale=wrap.clientWidth/inner.scrollWidth;
  inner.style.transform=scale<1?`scale(${scale})`:'scale(1)';
}
window.addEventListener('resize',scaleNav);

function formatDateToChinese(d){
  if(!d||d.length!==8)return'----';
  return d.slice(0,4)+'年'+d.slice(4,6)+'月'+d.slice(6,8)+'日';
}
function isRecent(d){
  if(!d||d.length!==8)return false;
  const y=+d.slice(0,4),m=+d.slice(4,6)-1,day=+d.slice(6,8);
  return (Date.now()-new Date(y,m,day).getTime())/86400000<=2;
}
function getTopItem(items){
  if(!items||items.length<2)return items?items[0]:null;
  return items[Math.abs(Math.floor(Math.sin(topSeed)*10000))%items.length];
}

async function fetchListText(){
  if(rawListText!==null)return rawListText;
  const res=await fetch('list.txt?t='+Date.now());
  rawListText=await res.text();
  return rawListText;
}
function parseItems(text){
  return text.trim().split('\n').filter(Boolean).map(l=>{
    const p=l.split('|').map(s=>s.trim());
    return {file:p[0],name:p[0].replace(/\.json$/i,''),date:p[1],size:p[2],origUrl:p[3],weight:API_WEIGHTS[p[0]]??999};
  });
}
function renderApi(){
  const container=document.getElementById('listContainer');
  fetchListText().then(text=>{
    document.getElementById('apiLoading').remove();
    let items=parseItems(text);
    const rotate=items.filter(i=>ROTATE_KEYWORDS.some(k=>i.name.includes(k)));
    const top=getTopItem(rotate);if(top)top.weight=-1;
    items.sort((a,b)=>a.weight-b.weight);
    container.innerHTML=items.map(it=>{
      const isNew=isRecent(it.date);
      const urls=[it.origUrl?`<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`:''];
      API_DOMAINS.forEach(d=>urls.push(`<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${d.base+it.name+'.json'}</span><button class="copy-btn" data-url="${d.base+it.name+'.json'}">复制</button></div>`));
      return `<div class="api-item" data-name="${it.name.toLowerCase()}">
        <div class="api-item-header">
          <div class="api-item-name">${it.name}</div>
          <div class="api-item-meta"><span class="${isNew?'badge-new':'badge-old'}">${formatDateToChinese(it.date)}</span></div>
        </div>
        <div class="api-item-urls">${urls.join('')}</div>
      </div>`;
    }).join('');
  });
}

document.addEventListener('click',e=>{
  const btn=e.target.closest('.copy-btn');
  if(!btn)return;
  const url=btn.dataset.url;
  navigator.clipboard?.writeText(url);
  btn.textContent='✅';
  setTimeout(()=>btn.textContent='复制',1500);
});

function globalSearch(){
  const kw=(document.getElementById('search').value||'').toLowerCase();
  document.querySelectorAll('#api-panel .api-item').forEach(i=>i.classList.toggle('hidden',!i.dataset.name.includes(kw)));
}

function renderTabs(){
  const inner=document.getElementById('navTabsInner');
  inner.innerHTML=VALID_TABS.map(t=>`<button class="nav-tab ${t===currentTabId?'active':''}" data-tab="${t}">${TAB_LABEL[t]}</button>`).join('');
  inner.onclick=e=>{
    const b=e.target.closest('.nav-tab');
    if(!b)return;
    inner.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active');
    currentTabId=b.dataset.tab;
    localStorage.setItem(TAB_KEY,currentTabId);
    showPanel(currentTabId);
  };
  scaleNav();
}
function showPanel(id){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id+'-panel').classList.add('active');
  if(id==='api')renderApi();
}

async function loadConfig(){
  try{
    const res=await fetch('config.json?t='+Date.now());
    const cfg=await res.json();
    if(cfg.site){
      if(cfg.site.logo)document.getElementById('header-logo').src=cfg.site.logo;
      if(cfg.site.title)document.getElementById('header-title').textContent=cfg.site.title;
      if(cfg.site.subtitle||cfg.site.qqGroup){
        let sub=cfg.site.subtitle||'备用数据源，防屏不迷路';
        sub+=cfg.site.qqGroup?'<br>QQ交流群：'+cfg.site.qqGroup:'<br>QQ交流群：1067685939';
        document.getElementById('header-subtitle').innerHTML=sub;
      }
    }
  }catch(e){}
}

renderTabs();
showPanel(currentTabId);
loadConfig();
</script>
</body>
</html>
