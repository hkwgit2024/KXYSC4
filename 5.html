<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>
<style>
/* ============================================================
   公共 CSS
   ============================================================ */

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { height:100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7; color:#1a2b3d;
  padding:20px 14px 10px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button:focus, button:focus-visible, input:focus, input:focus-visible,
.nav-tab:focus, .copy-btn:focus { outline:none !important; }

/* 容器 */
.container {
  max-width:820px;
  margin:0 auto;
  position:relative;
  width:100%;
  overflow-x:hidden;
  flex:1;
  display:flex;
  flex-direction:column;
}

/* 模式切换 */
#modeToggleBtn {
  position:absolute; top:14px; left:10px; z-index:999;
  width:56px; padding:6px 4px; border-radius:50px;
  border:1px solid #4a9eff; background:#fff; color:#4a9eff;
  font-size:.58rem; line-height:1.3; text-align:center; cursor:pointer;
}

/* 标题 */
.header-block { text-align:center; margin-bottom:16px; padding-top:14px; }
h1 { font-size:1.35rem; font-weight:700; color:#0a1a2b; }
h1 .header-logo {
  width:2rem; height:2rem; border-radius:50%; border:1px solid #4a9eff;
  object-fit:cover; vertical-align:-.5rem; margin-right:8px;
}
.header-divider { height:1px; background:#e4ebf3; margin:12px 0; }
.subtitle { font-size:.78rem; color:#7a8fa3; line-height:1.6; }

/* 搜索框 */
.search-box {
  width:100%; padding:10px 16px; border:1px solid #d4dbe5;
  border-radius:50px; font-size:.92rem; background:#fff; outline:none; -webkit-appearance:none;
}
body.simple-mode .search-box { margin-bottom:20px; }
body:not(.simple-mode) .search-box { margin-bottom:14px; }

/* 主卡片 */
.main-card {
  background:#fff; border-radius:8px; padding:20px 22px 18px;
  border:1px solid #d4dbe5;
  width:100%; overflow-x:hidden; flex:1;
}

/* 导航栏 */
.nav-tabs {
  display:flex; gap:10px; margin-bottom:16px;
  justify-content:center; flex-wrap:wrap;
}
.nav-tab {
  padding:7px 24px; border:1.5px solid #4a9eff; border-radius:40px;
  background:#fff; color:#4a9eff;
  font-size:.82rem; font-weight:500; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.nav-tab.active { background:#4a9eff; color:#fff; }
.nav-tab:active { transform:scale(.96); }
.nav-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  justify-content: center;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 0;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 5px 12px;
  border: 1.5px solid #4a9eff;
  border-radius: 30px;
  background: #fff;
  color: #4a9eff;
  font-size: .72rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.2;
}
.nav-tab.active { background: #4a9eff; color: #fff; }
.nav-tab:active { transform: scale(.95); }

/* 面板 */
.tab-panel { display:none; width:100%; }
.tab-panel.active { display:block; }

/* ===== 点播列表 ===== */
.api-list { display:flex; flex-direction:column; width:100%; }
.api-item { padding:14px 0; border-bottom:1px solid #e4ebf3; }
.api-item:last-child { border-bottom:none; }
.api-item.hidden { display:none !important; }
.api-item-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.api-item-name { font-size:1rem; font-weight:700; color:#0a1a2b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.api-item-meta { display:flex; align-items:center; gap:8px; font-size:.72rem; white-space:nowrap; flex-shrink:0; }
.badge-new { color:#16a34a; font-weight:600; }
.badge-old { color:#ca8a04; font-weight:600; }
.api-item-urls { display:flex; flex-direction:column; gap:6px; }
.url-line {
  display:flex; align-items:center; gap:8px; padding:6px 14px;
  background:#f4f8fc; border:1px solid #e0e8f0; border-radius:50px; min-width:0;
}
.url-tag { font-size:.68rem; font-weight:600; color:#3a5a7a; background:#d8e8f8; padding:2px 14px; border-radius:50px; white-space:nowrap; flex-shrink:0; }
.url-text { font-size:.78rem; color:#2563eb; word-break:break-all; overflow-wrap:break-word; line-height:1.4; flex:1; min-width:0; }

/* 复制按钮 */
.copy-btn {
  flex-shrink:0; background:#4a9eff; color:#fff; border:none; border-radius:30px;
  padding:0 14px; font-size:.7rem; font-weight:500; cursor:pointer; height:26px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s, transform .05s; white-space:nowrap; margin-left:auto;
  position:relative; z-index:2; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.copy-btn:active { background:#2a7ed9; transform:scale(.96); }
.copy-btn.copied { background:#3b9b6c; }

.loading { text-align:center; color:#8fa3b8; padding:60px 0; font-size:.88rem; }
.error-msg { text-align:center; color:#dc2626; padding:16px 20px; font-size:.8rem; background:#fef2f2; border:1px solid #fecaca; border-radius:4px; margin:12px 0; word-break:break-all; }

.page-footer { text-align:center; padding:24px 0 10px; font-size:.7rem; color:#8fa3b8; line-height:1.8; margin-top:auto; }

body.simple-mode .nav-tabs { display:none !important; }
body.simple-mode #download-panel,
body.simple-mode #danmu-panel,
body.simple-mode #about-panel { display:none !important; }
body.simple-mode #api-panel { display:block !important; }

/* ============================================================
   弹幕面板：子 tab（弹幕接口 / 弹幕教程）
   ============================================================ */
.danmu-subtabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  justify-content: center;
  flex-wrap: nowrap;
}
.danmu-subtab {
  padding: 5px 18px;
  border: 1.5px solid #4a9eff;
  border-radius: 30px;
  background: #fff;
  color: #4a9eff;
  font-size: .72rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.2;
}
.danmu-subtab.active { background: #4a9eff; color: #fff; }
.danmu-subtab:active { transform: scale(.95); }

.danmu-subpanel { display: none; }
.danmu-subpanel.active { display: block; }

/* 弹幕接口卡片 */
.danmu-card {
  background:#f8fafc; border-radius:12px; padding:14px 16px;
  border:1px solid #eef2f7;
}
.danmu-card h3 { font-size:.92rem; font-weight:600; color:#0b1e33; margin-bottom:8px; }
.danmu-card .danmu-tip { font-size:.76rem; color:#5a6f88; margin-bottom:4px; line-height:1.6; }
.danmu-item { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#fff; border-radius:50px; border:1px solid #e0e6ed; margin-top:8px; }
.danmu-item.hidden { display:none !important; }
.danmu-item .src-name { flex:0 0 auto; font-size:.78rem; font-weight:600; color:#0b1e33; }
.danmu-item .src-url { flex:1; font-size:.75rem; color:#2563eb; word-break:break-all; }

/* ===== 弹幕教程卡片 ===== */
.danmu-tutorial-card {
  background:#f8fafc; border-radius:12px; padding:14px 16px;
  border:1px solid #eef2f7;
}
.danmu-tutorial-card h3 { font-size:.92rem; font-weight:600; color:#0b1e33; margin-bottom:8px; }
.danmu-tutorial-card .danmu-tip { font-size:.76rem; color:#5a6f88; line-height:1.7; margin-bottom:12px; }
.danmu-section-title { font-size:.78rem; color:#0b1e33; font-weight:600; margin-top:14px; }
.danmu-desc { font-size:.74rem; color:#5a6f88; line-height:1.7; margin-top:2px; }
.danmu-steps { margin-top:12px; font-size:.74rem; color:#5a6f88; line-height:1.8; }
.danmu-note { margin-top:8px; font-size:.72rem; color:#8b9eb0; line-height:1.7; }
.danmu-note code, .danmu-desc code {
  font-size:.72rem; color:#2563eb; background:#eef3fa;
  border-radius:4px; padding:1px 5px;
}
.danmu-src-line {
  display:flex; align-items:center; gap:8px; padding:6px 14px;
  background:#fff; border-radius:50px; border:1px solid #e0e6ed; margin-top:6px;
}
.danmu-src-line .src-name { flex:0 0 auto; font-size:.72rem; font-weight:600; color:#0b1e33; }
.danmu-src-line .src-url { flex:1; font-size:.72rem; color:#2563eb; word-break:break-all; }

/* ===== 下载面板 ===== */
#download-panel { overflow-x:hidden; width:100%; }
#downloads-content { width:100%; overflow-x:hidden; }
#downloads-content.has-sidebar {
  display:flex; flex-direction:row; gap:12px; align-items:flex-start;
}
.dl-sidebar {
  flex:0 0 auto; width:96px;
  display:flex; flex-direction:column; gap:8px;
  padding:4px 2px 4px 0;
  position:sticky; top:0; align-self:flex-start;
  max-height:72vh; overflow-y:auto;
}
.dl-side-btn {
  width:100%; padding:11px 6px;
  border:1.5px solid #4a9eff; border-radius:12px;
  background:#fff; color:#4a9eff;
  font-size:.76rem; font-weight:600; line-height:1.3;
  cursor:pointer; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  word-break:break-word;
  transition:background .15s, color .15s, transform .05s;
}
.dl-side-btn .dl-side-icon { font-size:1.15rem; line-height:1; }
.dl-side-btn.active { background:#4a9eff; color:#fff; }
.dl-side-btn:active { transform:scale(.96); }
.dl-body { flex:1; min-width:0; }
.dl-group { display:none; width:100%; }
.dl-group.active { display:block; }
.dl-group-title { font-size:.95rem; font-weight:600; color:#0b1e33; margin-bottom:2px; }
.dl-group-desc { font-size:.7rem; color:#8b9eb0; margin-bottom:10px; }
.dl-cards {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:12px; width:100%; max-width:100%; overflow:hidden;
}
.download-card {
  background:#fff; border-radius:8px; padding:16px 14px 22px; text-align:center;
  border:1px solid #e4ebf3; text-decoration:none; color:inherit;
  display:flex; flex-direction:column; align-items:center; min-height:170px; min-width:0; max-width:100%; overflow:hidden;
}
.download-card.hidden { display:none !important; }
.download-card img { width:80%; max-width:100%; aspect-ratio:1/1; border-radius:8px; margin-bottom:12px; object-fit:cover; background:#f0f3f8; }
@media (max-width:600px) {
  #downloads-content.has-sidebar { gap:8px; }
  .dl-sidebar { width:72px; gap:6px; max-height:66vh; }
  .dl-side-btn { padding:9px 3px; font-size:.66rem; border-radius:10px; }
  .dl-side-btn .dl-side-icon { font-size:.95rem; }
  .dl-cards { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
}

/* ===== 关于面板 ===== */
#about-panel > div { background:#f8fafd !important; border-radius:8px !important; padding:16px 18px !important; margin-bottom:14px !important; border:1px solid #e4ebf3 !important; }
#about-panel h3 { font-size:.9rem !important; margin-bottom:10px !important; }
#about-panel p, #about-panel li { font-size:.75rem !important; line-height:1.7 !important; }
#about-panel > div > div { background:#fff !important; border:1px solid #e4ebf3 !important; border-radius:50px !important; padding:8px 16px !important; margin-top:8px !important; }

.contributor-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:12px; }
@media (min-width:600px) { .contributor-grid { grid-template-columns:repeat(3,1fr); } }
@media (min-width:960px) { .contributor-grid { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
.contributor-card {
  display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.6); border-radius:12px; padding:12px 14px;
}
.contributor-card.hidden { display:none !important; }
.contributor-avatar {
  width:44px; height:44px; border-radius:50%; object-fit:cover; flex-shrink:0;
  background:linear-gradient(135deg,#4a9eff,#1e6fda); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.85rem;
}
.contributor-info { flex:1; min-width:0; }
.contributor-name { font-size:.82rem; font-weight:600; color:#0a1a2b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.contributor-role { display:inline-block; margin-top:4px; font-size:.6rem; font-weight:500; color:#4a9eff; background:#e8f2ff; padding:2px 10px; border-radius:50px; }
.contributor-desc { margin-top:6px; font-size:.68rem; color:#7a8fa3; line-height:1.4; }
.contributor-social { margin-top:6px; font-size:.68rem; color:#4a9eff; }

/* ============================================================
   移动端（≤600px）
   ============================================================ */
@media (max-width: 600px) {
  body { padding: 14px 8px 6px; }

  #modeToggleBtn {
    top: 10px; left: 6px; width: 48px;
    font-size: .52rem; padding: 4px 2px;
  }
  .main-card { padding: 14px 14px 12px; }
  .header-block { padding-top: 10px; margin-bottom: 12px; }
  h1 { font-size: 1.15rem; }
  h1 .header-logo { width: 1.7rem; height: 1.7rem; vertical-align: -.4rem; }

  .nav-tabs { gap: 4px; margin-bottom: 10px; justify-content: space-between; flex-wrap: nowrap; }
  .nav-tab { flex: 1; text-align: center; padding: 4px 0; font-size: .95rem; border-radius: 24px; white-space: nowrap; }

  .api-item, .live-item { padding: 12px 0; }
  .api-item-name, .live-item-name { font-size: .92rem; }

  .url-line { padding: 6px 10px; gap: 6px; }
  .url-tag, .live-url-tag { font-size: .62rem; padding: 2px 10px; }
  .url-text, .live-url-text { font-size: .72rem; }
  .copy-btn { font-size: .62rem; padding: 0 10px; height: 24px; }

  /* 弹幕子tab移动端 */
  .danmu-subtabs { gap: 6px; }
  .danmu-subtab { padding: 4px 12px; font-size: .66rem; }
  .danmu-src-line { padding: 6px 10px; }
  .danmu-src-line .src-name { font-size: .66rem; }
  .danmu-src-line .src-url { font-size: .66rem; }
  .danmu-src-line .copy-btn { font-size: .6rem; padding: 0 8px; height: 22px; }
  .danmu-item { padding: 8px 10px; }
  .danmu-item .src-name { font-size: .72rem; }
  .danmu-item .src-url { font-size: .68rem; }

  .contributor-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
  .contributor-card { padding: 8px 10px; }
  .contributor-avatar { width: 36px; height: 36px; font-size: .75rem; }
  .contributor-name { font-size: .78rem; }
  .contributor-role { font-size: .58rem; padding: 2px 8px; }
  .contributor-desc { font-size: .65rem; line-height: 1.35; }
}
</style>
</head>

<body class="simple-mode">

<div class="container">

  <!-- 标题 -->
  <div class="header-block">

    <div class="header-divider"></div>

<script>
/* ============================================================
   完整 JS 逻辑
   - 弹幕面板：子tab（弹幕接口 / 弹幕教程）
   - 教程内容由 config.danmuSources 动态驱动
   ============================================================ */

const MODE_KEY = 'site_mode';
const TAB_KEY = 'current_tab';

let currentMode = localStorage.getItem(MODE_KEY) || 'simple';
let currentTabId = 'api';

const btn = document.getElementById('modeToggleBtn');
const searchBox = document.getElementById('search');
const mainCard = document.querySelector('.main-card');
const navTabs = document.getElementById('navTabs');
const headerLogo = document.getElementById('header-logo');
const headerSubtitle = document.getElementById('header-subtitle');

let rawListText = null;
let DOWNLOAD_SOURCES = [];
let DANMU_SOURCES = [];
let SITE_CONFIG = null;

document.body.className = currentMode + '-mode';
updateBtnText();
positionSearchBox();

/* ===== 全局复制 ===== */
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('.copy-btn');
  if (!copyBtn) return;
  e.preventDefault(); e.stopPropagation();
  const url = copyBtn.getAttribute('data-url');
  if (!url) return;
  const done = () => {
    const originalText = copyBtn.textContent;
    copyBtn.textContent = '✅ 已复制';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = originalText; copyBtn.classList.remove('copied'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fb);
  } else { fb(); }
  function fb() {
    const input = document.createElement('input'); input.value = url;
    input.style.position='fixed'; input.style.opacity='0';
    document.body.appendChild(input); input.focus(); input.select();
    try{document.execCommand('copy');}catch(_){}
    document.body.removeChild(input); done();
  }
});

/* ===== 工具 ===== */
function formatDateToChinese(d) {
  if(!d||d.length!==8) return '----';
  return d.slice(0,4)+'年'+d.slice(4,6)+'月'+d.slice(6,8)+'日';
}
function isRecent(d) {
  if(!d||d.length!==8) return false;
  const y=parseInt(d.slice(0,4)),m=parseInt(d.slice(4,6))-1,day=parseInt(d.slice(6,8));
  return (Date.now()-new Date(y,m,day).getTime())/86400000 <= 2;
}
function getInitials(name) { return name ? name.slice(0,1).toUpperCase() : '?'; }

/* ===== 配置加载 ===== */
async function loadConfig() {
  try {
    const res = await fetch('config.json?t='+Date.now()+'&r='+Math.random(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    SITE_CONFIG = await res.json();

    DOWNLOAD_SOURCES = Array.isArray(SITE_CONFIG.downloadSources) ? SITE_CONFIG.downloadSources : [];
    DANMU_SOURCES = Array.isArray(SITE_CONFIG.danmuSources) ? SITE_CONFIG.danmuSources : [];

    applySiteConfig();
    renderContributors(SITE_CONFIG.about && SITE_CONFIG.about.contributors);
    renderAboutDomains();
    renderTabsFromConfig();
  } catch(e) {
    DOWNLOAD_SOURCES=[]; DANMU_SOURCES=[];
    renderContributors([]);
    renderTabsFromConfig();
  }
}

function applySiteConfig() {
  const site = SITE_CONFIG.site;
  if (!site) return;
  if (site.logo) headerLogo.src = site.logo;
  if (site.title) {
    const h1 = headerLogo.parentNode;
    const textNodes = Array.from(h1.childNodes).filter(n => n.nodeType === Node.TEXT_NODE);
    textNodes.forEach(n => n.remove());
    h1.appendChild(document.createTextNode(site.title));
  }
  let sub = site.subtitle || '备用数据源，防屏不迷路';
  if (site.qqGroup) sub += '<br>QQ交流群：' + site.qqGroup;
  headerSubtitle.innerHTML = sub;

  // footer
  const footer = document.getElementById('pageFooter');
  if (footer) {
    let footerText = '';
    if (site.subtitle) footerText += site.subtitle + ' ';
    if (site.qqGroup) footerText += 'QQ 群：' + site.qqGroup + '。';
    if (footerText) footer.textContent = footerText;
  }

  // 声明
  const decl = document.getElementById('aboutDeclaration');
  if (decl && SITE_CONFIG.about && SITE_CONFIG.about.declaration) {
    decl.textContent = SITE_CONFIG.about.declaration;
  }
  // QQ
  const aboutQQ = document.getElementById('aboutQQ');
  if (aboutQQ && SITE_CONFIG.about && SITE_CONFIG.about.qqGroup) {
    aboutQQ.textContent = SITE_CONFIG.about.qqGroup;
    aboutQQ.href = 'https://qm.qq.com/q/gmRKKPT3x0';
  }
  // Telegram
  const aboutTG = document.getElementById('aboutTelegram');
  if (aboutTG && SITE_CONFIG.about && SITE_CONFIG.about.telegram) {
    aboutTG.textContent = SITE_CONFIG.about.telegram;
    aboutTG.href = SITE_CONFIG.about.telegram;
  }
}

function renderAboutDomains() {
  const container = document.getElementById('aboutDomains');
  if (!container) return;
  const domains = (SITE_CONFIG.about && SITE_CONFIG.about.domains) || [];
  if (!domains.length) { container.innerHTML = ''; return; }

function renderContributors(list) {

/* ===== 点播 ===== */
const API_WEIGHTS = {
  "菠菜园.json":1,"少儿频道.json":2,"饭太硬.json":4,"肥猫.json":5,
  "摸鱼.json":6,"王二小.json":7,"集多.json":8,"潇洒.json":9,
  "小米.json":10,"嗷呜.json":11,"南风.json":12,"小虎斑.json":13
};
const API_DOMAINS = [
  {tag:"备份一线", base:"https://0.12yue.de5.net/tvbox/"},
  {tag:"备份二线", base:"https://0.cdz.qzz.io/tvbox/"},
  {tag:"备份三线", base:"https://0.wdzb.eu.cc/tvbox/"}
];

async function fetchListText() {
  if(rawListText!==null) return rawListText;
  const res = await fetch('list.txt?t='+Date.now()+'&r='+Math.random(), {cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  rawListText = await res.text(); return rawListText;
}
function parseItems(text) {
  if(!text||!text.trim()) return [];
  return text.trim().split('\n').filter(l=>l.trim()).map(line=>{
    const p=line.split('|').map(s=>s.trim()); if(!p[0]) return null;
    return {file:p[0],name:p[0].replace(/\.json$/i,''),date:p[1]||'',size:p[2]||'',origUrl:p[3]||'',weight:API_WEIGHTS.hasOwnProperty(p[0])?API_WEIGHTS[p[0]]:999};
  }).filter(Boolean);
}
function renderApi() {
  const container = document.getElementById('listContainer');
  fetchListText().then(text=>{
    const tip=document.getElementById('apiLoading'); if(tip) tip.style.display='none';
    let items=parseItems(text);
    if(!items.length){container.innerHTML='<div class="error-msg">⚠️ 接口列表为空，请检查 list.txt</div>';return;}
    items.sort((a,b)=>a.weight-b.weight);
    let html='';
    items.forEach(it=>{
      const isNew=isRecent(it.date); let lines='';
      if(it.origUrl) lines+=`<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`;
      API_DOMAINS.forEach(d=>{const u=d.base+it.name+'.json';lines+=`<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${u}</span><button class="copy-btn" data-url="${u}">复制</button></div>`;});
      html+=`<div class="api-item" data-name="${it.name.toLowerCase()}"><div class="api-item-header"><div class="api-item-name" title="${it.name}">${it.name}</div><div class="api-item-meta"><span class="${isNew?'badge-new':'badge-old'}">备份时间 ${formatDateToChinese(it.date)}</span>${it.size?'&nbsp;&nbsp;'+it.size:''}</div></div><div class="api-item-urls">${lines}</div></div>`;
    });
    container.innerHTML=html;
  }).catch(err=>{
    const tip=document.getElementById('apiLoading'); if(tip) tip.style.display='none';
    container.innerHTML=`<div class="error-msg">❌ 接口加载失败：${err.message||err}</div>`;
  });
}

/* ===== 下载：左侧边按钮，每组一个 ===== */
let dlCache = new Map();
let dlCurrentGroup = null;

async function renderDownloads(force) {
  const container = document.getElementById('downloads-content');
  if (!container || (container.dataset.rendered && !force)) return;
  if (!DOWNLOAD_SOURCES.length) { container.innerHTML = '<div class="error-msg">⚠️ 未配置下载源</div>'; return; }

  if (!container.dataset.rendered) {
    container.dataset.rendered = 'true';
    container.className = 'has-sidebar';
    container.innerHTML = `
      <div class="dl-sidebar" id="dlSidebar"></div>
      <div class="dl-body" id="dlBody"><div class="loading">⏳ 正在加载下载资源...</div></div>`;
  }

  const sidebar = document.getElementById('dlSidebar');
  const body = document.getElementById('dlBody');

  if (!sidebar.dataset.built) {
    sidebar.dataset.built = 'true';
    sidebar.innerHTML = DOWNLOAD_SOURCES.map((src, idx) => {
      const icon = src.icon ? `<img src="${src.icon}" style="width:1.4rem;height:1.4rem;border-radius:6px;object-fit:cover">`
                            : `<span class="dl-side-icon">📦</span>`;
      return `<button class="dl-side-btn ${idx === 0 ? 'active' : ''}" data-key="${src.url}">${icon}<span>${src.name || ('组' + (idx + 1))}</span></button>`;
    }).join('');

    sidebar.querySelectorAll('.dl-side-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sidebar.querySelectorAll('.dl-side-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showDownloadGroup(btn.getAttribute('data-key'));
      });
    });
  }

  await Promise.all(DOWNLOAD_SOURCES.map(async src => {
    if (dlCache.has(src.url)) return;
    try {
      const res = await fetch(src.url + '?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();
      const cleaned = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/：/g, ':').replace(/，/g, ',');
      const data = JSON.parse(cleaned);
      let cards = [];
      const arr = data.list || data;
      if (Array.isArray(arr)) {
        arr.forEach(group => {
          if (group && Array.isArray(group.list)) group.list.forEach(i => cards.push(i));
          else cards.push(group);
        });
      }
      dlCache.set(src.url, { src, cards });
    } catch (e) {
      dlCache.set(src.url, { src, cards: [], error: e.message });
    }
  }));

  showDownloadGroup(dlCurrentGroup || DOWNLOAD_SOURCES[0].url);
}

function showDownloadGroup(key) {
  dlCurrentGroup = key;
  const body = document.getElementById('dlBody');
  if (!body) return;
  const entry = dlCache.get(key);
  if (!entry) { body.innerHTML = '<div class="loading">⏳ 加载中...</div>'; return; }
  const { src, cards, error } = entry;
  if (error) { body.innerHTML = `<div class="error-msg">❌ ${src.name} 加载失败：${error}</div>`; return; }
  if (!cards.length) { body.innerHTML = `<div class="error-msg">⚠️ ${src.name} 暂无资源</div>`; return; }

  const title = src.name ? `<div class="dl-group-title">${src.name}</div>` : '';
  const desc = src.description ? `<div class="dl-group-desc">${src.description}</div>` : '';
  const cardsHtml = cards.map(i => `
    <a class="download-card" href="${i.url || '#'}" target="_blank" rel="noopener noreferrer" data-name="${(i.name || '').toLowerCase()}">
      <img src="${i.icon || ''}" onerror="this.style.visibility='hidden'" style="width:90%;max-width:100%;height:auto;aspect-ratio:1/1;border-radius:10px;margin-bottom:14px;object-fit:cover;background:#f0f3f8;">
      <div style="flex:1;width:100%;margin-top:auto;">
        <div style="font-size:.76rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.name || ''}</div>
        ${i.version ? `<div style="font-size:.6rem;color:#8b9eb0;margin-top:2px;">${i.version}</div>` : ''}
      </div>
    </a>`).join('');

  body.innerHTML = `<div class="dl-group active">${title}${desc}<div class="dl-cards">${cardsHtml}</div></div>`;
}

   弹幕：接口 + 教程（教程由 config.danmuSources 动态驱动）

/* 渲染弹幕接口列表（danmuSources 驱动） */
function renderDanmuList() {
  const container = document.getElementById('danmu-content');
  if (!container) return;
  if (container.dataset.rendered === 'true') return;

  if (!DANMU_SOURCES.length) {
    container.innerHTML = '<div class="error-msg">⚠️ 未配置弹幕源，请检查 config.json 中的 danmuSources</div>';
    return;
  }

  let rows = '';
  DANMU_SOURCES.forEach(s => {
    rows += `
      <div class="danmu-item" data-name="${s.name.toLowerCase()}">
        <span class="src-name">${s.name}</span>
        <span class="src-url">${s.url}</span>
        <button class="copy-btn" data-url="${s.url}">复制</button>
      </div>`;
  });

  container.innerHTML = `
    <div class="danmu-card">
      <h3>💬 弹幕接口</h3>
      <p class="danmu-tip">共 ${DANMU_SOURCES.length} 条，点击「复制」把地址填入播放器的弹幕接口。</p>
      ${rows}
    </div>`;
  container.dataset.rendered = 'true';
}

/* 渲染弹幕教程（danmuSources 驱动，自动生成两种壳子的地址） */
function renderDanmuTutorial() {
  const container = document.getElementById('danmuTutorialCard');
  if (!container) return;
  if (container.dataset.rendered === 'true') return;

  if (!DANMU_SOURCES.length) {
    container.innerHTML = '<div class="error-msg">⚠️ 未配置弹幕源</div>';
    return;
  }

  // ① new壳子：只填源本身
  const rowsType1 = DANMU_SOURCES.map(s => `
    <div class="danmu-src-line">
      <span class="src-name">${s.name}</span>
      <span class="src-url">${s.url}</span>
      <button class="copy-btn" data-url="${s.url}">复制</button>
    </div>`).join('');

  // ② 需要搜索接口的壳子：url + /api/v2/fongmi/danmaku?name={name}&episode={episode}
  const rowsType2 = DANMU_SOURCES.map(s => {
    const fullUrl = s.url + '/api/v2/fongmi/danmaku?name={name}&episode={episode}';
    return `
      <div class="danmu-src-line">
        <span class="src-name">${s.name}</span>
        <span class="src-url">${fullUrl}</span>
        <button class="copy-btn" data-url="${fullUrl}">复制</button>
      </div>`;
  }).join('');

  container.innerHTML = `
    <h3>💬 弹幕使用教程</h3>
    <p class="danmu-tip">两种壳子填的东西不一样，按自己壳子的类型选对应的一段。</p>

    <p class="danmu-section-title">① new 壳子：只填源本身</p>
    <p class="danmu-desc">new 是单独一类壳子，它的弹幕接口只需要填弹幕源地址本身，填好后播放时会自动按片名+集数拉取弹幕。</p>
    <p class="danmu-desc">弹幕接口：<code>{弹幕源地址}</code></p>
    ${rowsType1}

    <p class="danmu-section-title">② 需要搜索接口的壳子：填下面的搜索接口</p>
    <p class="danmu-desc">如果你的壳子弹幕里需要填搜索接口，就填下面的完整地址；播放器会按片名和集数去拉弹幕。</p>
    <p class="danmu-desc">搜索接口：<code>{弹幕源地址}/api/v2/fongmi/danmaku?name={name}&amp;episode={episode}</code></p>
    ${rowsType2}

    <div class="danmu-steps">
      <strong>使用步骤：</strong><br>
      1. 先确认壳子类型：new 壳子只填源地址，需要搜索接口的壳子填完整地址<br>
      2. 播放器 → 设置 → 弹幕，把对应地址粘贴进去并保存<br>
      3. 播放时自动匹配弹幕；搜不到就换一个源
    </div>
    <p class="danmu-note">提示：<code>{name}</code> 与 <code>{episode}</code> 是占位符，原样保留不要改成具体片名；更多弹幕源见上方「弹幕接口」标签页。</p>
  `;
  container.dataset.rendered = 'true';
}

/* 弹幕面板显示时，按当前子tab渲染 */
function renderDanmu() {
  renderDanmuList();
  renderDanmuTutorial();
}

/* 弹幕子 tab 切换 */
function initDanmuSubTabs() {
  const danmuPanel = document.getElementById('danmu-panel');
  if (!danmuPanel) return;
  danmuPanel.addEventListener('click', (e) => {
    const tab = e.target.closest('.danmu-subtab');
    if (!tab) return;
    danmuPanel.querySelectorAll('.danmu-subtab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.getAttribute('data-target');
    danmuPanel.querySelectorAll('.danmu-subpanel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById(target);
    if (panel) panel.classList.add('active');
  });
}

/* ===== 面板显示控制 ===== */
function showPanel(tabId) {
  // 重置搜索
  if (searchBox) {
    searchBox.value = '';
    document.querySelectorAll('.api-item.hidden').forEach(e => e.classList.remove('hidden'));
    document.querySelectorAll('.download-card.hidden').forEach(e => e.classList.remove('hidden'));
    document.querySelectorAll('.danmu-item.hidden').forEach(e => e.classList.remove('hidden'));
    document.querySelectorAll('.contributor-card.hidden').forEach(e => e.classList.remove('hidden'));
  }

  if (tabId === 'api') renderApi();
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(tabId + '-panel');
  if (panel) panel.classList.add('active');

  if (tabId === 'download') renderDownloads();
  if (tabId === 'danmu') renderDanmu();

  const t = tabsData.find(x => x.id === tabId);
  if (searchBox) searchBox.style.display = (t && t.hideSearch) ? 'none' : '';
}

/* ===== 搜索 ===== */
function globalSearch() {
  const kw = (searchBox.value || '').toLowerCase().trim();
  document.querySelectorAll('#api-panel .api-item').forEach(e => {
    const n = e.getAttribute('data-name') || '';
    e.classList.toggle('hidden', !n.includes(kw));
  });
  document.querySelectorAll('.download-card').forEach(c => {
    const n = c.getAttribute('data-name') || '';
    c.classList.toggle('hidden', !n.includes(kw));
  });
  document.querySelectorAll('#danmu-panel .danmu-item').forEach(e => {
    const n = e.getAttribute('data-name') || '';
    e.classList.toggle('hidden', !n.includes(kw));
  });
  document.querySelectorAll('.contributor-card').forEach(c => {
    const n = c.getAttribute('data-name') || '';
    c.classList.toggle('hidden', !n.includes(kw));
  });
}

/* ===== 搜索框位置 ===== */
function positionSearchBox() {
  if (currentMode === 'simple') {
    if (searchBox.parentNode !== mainCard.parentNode) mainCard.parentNode.insertBefore(searchBox, mainCard);
  } else {
    if (searchBox.parentNode !== mainCard) navTabs.insertAdjacentElement('afterend', searchBox);
  }
}
function updateBtnText() {
  btn.innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版';
}

/* ===== 模式切换 ===== */
btn.addEventListener('click', () => {
  currentMode = currentMode === 'simple' ? 'full' : 'simple';
  localStorage.setItem(MODE_KEY, currentMode);
  document.body.className = currentMode + '-mode';
  updateBtnText();

  if (currentMode !== 'simple') {
    positionSearchBox();
    renderTabsFromConfig();
    showPanel(currentTabId);
  } else {
    currentTabId = tabsData[0] ? tabsData[0].id : 'api';
    localStorage.setItem(TAB_KEY, currentTabId);
    searchBox.style.display = '';
    positionSearchBox();
    if (currentTabId === 'api') renderApi();
  }
});

/* ===== 启动 ===== */
initDanmuSubTabs();
renderTabsFromConfig();

if (currentMode === 'simple') {
  // 简洁版默认只渲染点播
  renderApi();
} else {
  showPanel(currentTabId);
}

loadConfig().then(() => {
  if (currentMode !== 'simple') {
    renderDownloads();
    renderDanmu();
  }
});
