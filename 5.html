<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海量接口搬运备份6</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --card: #fff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  header { text-align: center; margin-bottom: 24px; }
  header img.logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  header h1 { font-size: 1.5rem; margin: 8px 0; }
  header p { color: var(--muted); font-size: .9rem; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; }
  .search-bar button { padding: 10px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .nav-tab { padding: 8px 16px; border: 1px solid var(--border); background: var(--card); border-radius: 20px; cursor: pointer; font-size: .85rem; }
  .nav-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: 1rem; margin-bottom: 6px; }
  .card p { font-size: .82rem; color: var(--muted); }
  .card a { color: var(--primary); text-decoration: none; word-break: break-all; }
  .copy-btn { margin-left: 8px; padding: 2px 8px; font-size: .75rem; border: 1px solid var(--primary); background: #fff; color: var(--primary); border-radius: 4px; cursor: pointer; }
  
  /* 弹幕子选项卡 */
  .danmu-subtabs { display: flex; gap: 10px; margin-bottom: 14px; justify-content: center; }
  .danmu-subtab { padding: 6px 14px; border: 1px solid var(--primary); background: #fff; color: var(--primary); border-radius: 20px; cursor: pointer; font-size: .82rem; }
  .danmu-subtab.active { background: var(--primary); color: #fff; }
  .danmu-subpanel { display: none; }
  .danmu-subpanel.active { display: block; }
  .danmu-tutorial-card { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin-top: 4px; border: 1px solid #eef2f7; font-size: .85rem; line-height: 1.7; }
  .danmu-tutorial-card code { color: var(--primary); background: #eef3fa; padding: 1px 5px; border-radius: 4px; }
  .danmu-src-line { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #fff; border-radius: 50px; border: 1px solid #e0e6ed; margin-top: 6px; }
  .danmu-src-line .src-name { font-weight: 600; font-size: .78rem; flex: 0 0 auto; }
  .danmu-src-line .src-url { flex: 1; font-size: .75rem; color: var(--primary); word-break: break-all; }
  
  @media (max-width: 600px) {
    .nav-tabs { justify-content: center; }
    .danmu-src-line { flex-direction: column; align-items: flex-start; border-radius: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <img class="logo" src="vip/jueson.jpg" alt="logo">
    <h1>海量接口搬运备份</h1>
    <p>备用数据源，防屏不迷路</p>
  </header>

  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="搜索接口/下载/弹幕...">
    <button onclick="globalSearch()">搜索</button>
  </div>

  <div class="nav-tabs" id="navTabs"></div>

  <!-- 接口（点播） -->
  <div class="panel" id="api-panel">
    <div id="api-content"></div>
  </div>

  <!-- 下载（直播/下载源） -->
  <div class="panel" id="download-panel">
    <div id="download-content"></div>
  </div>

  <!-- 弹幕 -->
  <div class="panel" id="danmu-panel">
    <div class="danmu-subtabs">
      <button class="danmu-subtab active" data-target="danmu-list">弹幕接口</button>
      <button class="danmu-subtab" data-target="danmu-tutorial">弹幕教程</button>
    </div>
    <div class="danmu-subpanel active" id="danmu-list">
      <div id="danmu-content"></div>
    </div>
    <div class="danmu-subpanel" id="danmu-tutorial">
      <div id="danmu-tutorial-content"></div>
    </div>
  </div>

  <!-- 关于 -->
  <div class="panel" id="about-panel">
    <div id="about-content"></div>
  </div>
</div>

<script>
/* ========= 配置注入（实际使用时可改为 fetch('config.json')） ========= */
// 此处省略 CONFIG 全量赋值以节省篇幅，实际请放入上方完整 config.json 内容
// const CONFIG = {...};

/* ========= 全局变量（兼容你原有逻辑） ========= */
const DANMU_SOURCES = CONFIG.danmuSources || [];
const DOWNLOAD_SOURCES = CONFIG.downloadSources || [];
const API_DOMAINS = CONFIG.api.domains || [];
const WEIGHTS = CONFIG.api.weights || {};

/* ========= 导航渲染 ========= */
function renderNav() {
  const nav = document.getElementById('navTabs');
  nav.innerHTML = CONFIG.tabs.map(t => `<button class="nav-tab" data-id="${t.id}">${t.label}</button>`).join('');
  nav.addEventListener('click', e => {
    const id = e.target.dataset.id;
    if (!id) return;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === id + '-panel'));
    if (id === 'danmu') renderDanmu();
    if (id === 'api') renderApi();
    if (id === 'download') renderDownload();
    if (id === 'about') renderAbout();
  });
  // 默认激活第一个
  const first = CONFIG.tabs[0];
  document.querySelector(`.nav-tab[data-id="${first.id}"]`).classList.add('active');
  document.getElementById(first.id + '-panel').classList.add('active');
  if (first.id === 'api') renderApi();
}

/* ========= 接口（点播）原逻辑 ========= */
function renderApi() {
  const c = document.getElementById('api-content');
  if (c.dataset.rendered) return;
  let html = '';
  API_DOMAINS.forEach(d => {
    Object.keys(WEIGHTS).forEach(name => {
      html += `<div class="card">
        <h3>${d.tag} - ${name.replace('.json','')}</h3>
        <p><a href="${d.base + name}" target="_blank">${d.base + name}</a></p>
      </div>`;
    });
  });
  c.innerHTML = html;
  c.dataset.rendered = 'true';
}

/* ========= 下载（直播）原逻辑 ========= */
function renderDownload() {
  const c = document.getElementById('download-content');
  if (c.dataset.rendered) return;
  let html = DOWNLOAD_SOURCES.map(s => `<div class="card">
    <h3>${s.name} ${s.description ? `<span style="font-size:.75rem;color:#64748b">(${s.description})</span>` : ''}</h3>
    <p><a href="${s.url}" target="_blank">${s.url}</a></p>
  </div>`).join('');
  c.innerHTML = html;
  c.dataset.rendered = 'true';
}

/* ========= 弹幕：接口 + 教程（无loading） ========= */
function renderDanmu() {
  const container = document.getElementById('danmu-content');
  if (!container) return;
  if (container.dataset.rendered === 'true') return;
  container.innerHTML = '';
  if (!DANMU_SOURCES.length) {
    container.innerHTML = '<div class="card">⚠️ 未配置弹幕源</div>';
    return;
  }
  let rows = DANMU_SOURCES.map(s => `<div class="danmu-src-line">
    <span class="src-name">${s.name}</span>
    <span class="src-url">${s.url}</span>
    <button class="copy-btn" data-url="${s.url}">复制</button>
  </div>`).join('');
  container.innerHTML = rows;
  container.dataset.rendered = 'true';
}

function renderDanmuTutorial() {
  const c = document.getElementById('danmu-tutorial-content');
  if (!c || !CONFIG.danmuTutorial) return;
  if (c.dataset.rendered) return;
  const t = CONFIG.danmuTutorial;
  let html = `<div class="danmu-tutorial-card">
    <h3 style="margin-bottom:8px">${t.title}</h3>
    <p>${t.intro}</p>
    <h4 style="margin:10px 0 4px">${t.newShell.title}</h4>
    <p>${t.newShell.desc}</p>
    <p><code>${t.newShell.format}</code></p>
    <h4 style="margin:10px 0 4px">${t.searchShell.title}</h4>
    <p>${t.searchShell.desc}</p>
    <p><code>${t.searchShell.format}</code></p>
    <p style="margin-top:8px">${t.steps.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</p>
    <p style="margin-top:8px;color:#64748b">${t.note}</p>
  </div>`;
  // 教程中动态列出源
  html += '<div style="margin-top:12px"><b>当前弹幕源（自动同步）：</b>';
  DANMU_SOURCES.forEach(s => {
    html += `<div class="danmu-src-line">
      <span class="src-name">${s.name}</span>
      <span class="src-url">${s.url}</span>
    </div>`;
  });
  html += '</div>';
  c.innerHTML = html;
  c.dataset.rendered = 'true';
}

/* ========= 关于 ========= */
function renderAbout() {
  const c = document.getElementById('about-content');
  if (c.dataset.rendered) return;
  const a = CONFIG.about;
  let html = `<div class="card">
    <h3>声明</h3><p>${a.declaration}</p>
    <p style="margin-top:8px">QQ群：<a href="https://qm.qq.com/cgi-bin/qm/qr?k=${a.qqGroup}" target="_blank">${a.qqGroup}</a></p>
    <p>TG：<a href="${a.telegram}" target="_blank">${a.telegram}</a></p>
  </div>`;
  a.contributors.forEach(co => {
    html += `<div class="card"><h3>${co.name}（${co.role}）</h3><p>${co.desc}</p></div>`;
  });
  c.innerHTML = html;
  c.dataset.rendered = 'true';
}

/* ========= 弹幕子tab切换 ========= */
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  // 弹幕子tab
  const danmuPanel = document.getElementById('danmu-panel');
  danmuPanel.addEventListener('click', e => {
    const tab = e.target.closest('.danmu-subtab');
    if (!tab) return;
    danmuPanel.querySelectorAll('.danmu-subtab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.target;
    danmuPanel.querySelectorAll('.danmu-subpanel').forEach(p => p.classList.remove('active'));
    document.getElementById(target).classList.add('active');
    if (target === 'danmu-list') renderDanmu();
    if (target === 'danmu-tutorial') renderDanmuTutorial();
  });
  // 复制
  document.addEventListener('click', e => {
    if (e.target.classList.contains('copy-btn')) {
      navigator.clipboard.writeText(e.target.dataset.url);
      e.target.textContent = '已复制';
      setTimeout(()=>e.target.textContent='复制', 1200);
    }
  });
});

/* ========= 搜索（简易全局） ========= */
function globalSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) return;
  // 简单高亮过滤：遍历所有卡片
  document.querySelectorAll('.card, .danmu-src-line').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? '' : 'none';
  });
}
</script>
</body>
</html>
