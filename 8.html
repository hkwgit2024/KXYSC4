<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>海量接口搬运备份</title>

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height:100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#eef2f7;
  color:#1a2b3d;
  padding:20px 14px 10px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}

.container {
  max-width:820px;
  margin:auto;
  width:100%;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* 头部 */
.header-block {
  text-align:center;
  margin-bottom:24px;
}

h1 {
  font-size:1.35rem;
  font-weight:700;
  color:#0a1a2b;
}

h1 .header-logo {
  width:2rem;
  height:2rem;
  border-radius:50%;
  border:1px solid #4a9eff;
  object-fit:cover;
  vertical-align:-.5rem;
  margin-right:8px;
}

.header-divider {
  height:1px;
  background:#e4ebf3;
  margin:14px 0;
}

.subtitle {
  font-size:.78rem;
  color:#7a8fa3;
  line-height:1.6;
}

/* 状态卡片 */
.main-card {
  background:#fff;
  border-radius:8px;
  padding:22px 20px;
  border:1px solid #d4dbe5;
  text-align:center;
}

.status-text {
  font-size:.92rem;
  color:#2563eb;
  line-height:1.8;
}

.countdown {
  color:#10b981;
  font-weight:700;
  font-size:1.1rem;
}

/* footer */
.page-footer {
  text-align:center;
  padding:24px 0 10px;
  font-size:.7rem;
  color:#8fa3b8;
  line-height:1.8;
}

@media (max-width:600px) {
  body { padding:14px 10px 6px; }
  .main-card { padding:18px 14px; }
}
</style>
</head>

<body>

<div class="container">

  <!-- 头部 -->
  <div class="header-block">
    <h1>
      <img class="header-logo" src="https://0.12yue.de5.net/tvbox/x/jueson.jpg" alt="Logo">
      海量接口搬运备份
    </h1>
    <div class="header-divider"></div>
    <p class="subtitle">
      备用数据源，防屏不迷路<br>
      QQ交流群：1067685939
    </p>
  </div>

  <!-- 检测状态 -->
  <div class="main-card">
    <div class="status-text" id="status">⏳ 正在检测可用线路...</div>
  </div>

</div>

<!-- footer -->
<footer class="page-footer">
  <p>
    本站接口资源由【误道者】整理。所有资源均来自互联网，版权归原作者所有。<br>
    仅供测试学习使用，请勿用于违法及商业用途，请勿付费购买。<br>
    如涉及侵权，请联系删除。QQ 群：1067685939。
  </p>
</footer>

<script>
const domains = [
  "https://0.12yue.de5.net",
  "https://0.cdz.qzz.io",
  "https://0.wdzb.eu.cc",
  "https://tvbox.moliys.icu"
];

const statusEl = document.getElementById("status");

async function checkDomain(url, timeout = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    await fetch(url, {
      method: "GET",
      mode: "no-cors",
      signal: controller.signal
    });
    clearTimeout(timer);
    return true;
  } catch (e) {
    clearTimeout(timer);
    return false;
  }
}

function startCountdown(url, seconds = 5) {
  let remain = seconds;
  statusEl.innerHTML = `
    ✅ 线路可用，<span class="countdown">${remain}</span> 秒后跳转<br>
    <span style="font-size:.78rem;color:#5a6f88">${url}</span>
  `;

  const countdown = setInterval(() => {
    remain--;
    if (remain > 0) {
      statusEl.innerHTML = `
        ✅ 线路可用，<span class="countdown">${remain}</span> 秒后跳转<br>
        <span style="font-size:.78rem;color:#5a6f88">${url}</span>
      `;
    } else {
      clearInterval(countdown);
      window.location.href = url;
    }
  }, 1000);
}

async function startCheck() {
  for (let i = 0; i < domains.length; i++) {
    const url = domains[i];
    statusEl.textContent = `⏳ 正在检测第 ${i + 1} 个线路：${url}`;

    const ok = await checkDomain(url);
    if (ok) {
      startCountdown(url, 5);
      return;
    }
  }

  statusEl.innerHTML = "❌ 所有线路均不可用，请稍后再试";
}

startCheck();
</script>

</body>
</html>
