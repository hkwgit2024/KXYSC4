<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海量接口搬运备份9</title>
<style>
/* ========== 全局重置 ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
  min-height: 100vh;
  color: #1a2b3c;
  line-height: 1.6;
}

/* ========== 头部 ========== */
.header {
  background: linear-gradient(135deg, #1e6fda 0%, #4a9eff 100%);
  color: #fff;
  padding: 24px 16px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 60%);
  animation: headerGlow 8s ease-in-out infinite;
}

@keyframes headerGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(5%, 5%); }
}

.header h1 {
  font-size: 1.4rem;
  font-weight: 800;
  margin-bottom: 4px;
  position: relative;
  letter-spacing: -.02em;
}

.header p {
  font-size: .82rem;
  opacity: .88;
  position: relative;
}

/* ========== 搜索栏 ========== */
.search-bar {
  max-width: 640px;
  margin: -14px auto 0;
  padding: 0 14px;
  position: relative;
  z-index: 10;
}

.search-input {
  width: 100%;
  height: 40px;
  padding: 0 38px 0 14px;
  border: 1.5px solid #dde4ef;
  border-radius: 12px;
  font-size: .85rem;
  background: #fff;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}

.search-input:focus {
  border-color: #4a9eff;
  box-shadow: 0 0 0 3px rgba(74,158,255,.12);
}

.search-clear {
  position: absolute;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #e8eef5;
  color: #7a8fa3;
  font-size: .8rem;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
}

.search-clear.visible {
  display: flex;
}

/* ========== 主容器 ========== */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px;
}

/* ========== 统计栏 ========== */
.stats-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.stat-item {
  flex: 1;
  background: #fff;
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  border: 1px solid #e4ebf3;
}

.stat-num {
  font-size: 1.3rem;
  font-weight: 800;
  color: #1e6fda;
  line-height: 1.2;
}

.stat-label {
  font-size: .68rem;
  color: #7a8fa3;
  margin-top: 2px;
}

/* ========== 分类标签 ========== */
.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}

.category-tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  padding: 7px 16px;
  border-radius: 50px;
  font-size: .8rem;
  font-weight: 600;
  background: #fff;
  border: 1px solid #e4ebf3;
  color: #4a5d6a;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}

.tab-btn.active {
  background: #1e6fda;
  color: #fff;
  border-color: #1e6fda;
  box-shadow: 0 2px 8px rgba(30,111,218,.3);
}

/* ========== 接口卡片 ========== */
.api-card {
  background: #fff;
  border-radius: 14px;
  border: 1px solid #e4ebf3;
  margin-bottom: 10px;
  overflow: hidden;
  transition: transform .12s, box-shadow .12s;
}

.api-card:active {
  transform: scale(.995);
}

.card-header {
  padding: 12px 14px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
}

.card-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #e8f4ff, #d8eaff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

.card-info {
  flex: 1;
  min-width: 0;
}

.card-title {
  font-size: .9rem;
  font-weight: 700;
  color: #0b1e33;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-size {
  font-size: .65rem;
  font-weight: 600;
  color: #1e6fda;
  background: #e6f2ff;
  padding: 1px 7px;
  border-radius: 50px;
}

.card-date {
  font-size: .7rem;
  color: #8fa3b5;
}

.expand-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #f0f4f8;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .2s;
  flex-shrink: 0;
  border: none;
  color: #4a5d6a;
  font-size: .75rem;
}

.expand-btn.expanded {
  transform: rotate(180deg);
  background: #e6f2ff;
  color: #1e6fda;
}

.card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .25s ease;
}

.card-body.expanded {
  max-height: 400px;
}

.link-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-top: 1px solid #f0f4f8;
}

.link-label {
  font-size: .7rem;
  font-weight: 600;
  color: #7a8fa3;
  min-width: 48px;
  flex-shrink: 0;
}

.link-url {
  flex: 1;
  font-size: .75rem;
  color: #4a5d6a;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: "SF Mono", "Fira Code", monospace;
}

.copy-btn {
  padding: 5px 12px;
  border-radius: 7px;
  font-size: .72rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all .12s;
  flex-shrink: 0;
}

.copy-btn-primary {
  background: #1e6fda;
  color: #fff;
}

.copy-btn-primary:active {
  background: #155bc0;
  transform: scale(.95);
}

.copy-btn-secondary {
  background: #f0f4f8;
  color: #4a5d6a;
}

.copy-btn-secondary:active {
  background: #e0e8f0;
  transform: scale(.95);
}

/* ========== 关于面板 ========== */
#about-panel {
  display: none;
}

#about-panel.active {
  display: block;
}

#about-panel > div {
  background: #f8fafd !important;
  border-radius: 8px !important;
  padding: 16px 18px !important;
  margin-bottom: 14px !important;
  border: 1px solid #e4ebf3 !important;
}

#about-panel h3 {
  font-size: .95rem;
  font-weight: 700;
  color: #0b1e33;
  margin-bottom: 8px;
}

#about-panel p,
#about-panel li {
  font-size: .78rem;
  color: #4a5d6a;
  line-height: 1.7;
}

#about-panel ul {
  padding-left: 16px;
}

#about-panel a {
  color: #1e6fda;
  text-decoration: none;
}

#about-panel a:active {
  opacity: .7;
}

/* ========== 合作共创 — 每人独立小圆角卡片 ========== */
#about-panel #contributors-card {
  background: transparent !important;
  border-radius: 0 !important;
  padding: 0 !important;
  margin-bottom: 0 !important;
  border: none !important;
  box-shadow: none !important;
}

.contributor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  width: 100%;
}

.contributor-card {
  background: #fff;
  border: 1px solid #e4ebf3;
  border-radius: 14px;
  padding: 16px 12px 14px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform .15s, box-shadow .15s;
}

.contributor-card:active {
  transform: scale(.97);
}

.contributor-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4a9eff, #1e6fda);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  overflow: hidden;
  flex-shrink: 0;
}

.contributor-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.contributor-name {
  font-size: .85rem;
  font-weight: 700;
  color: #0b1e33;
  line-height: 1.3;
}

.contributor-role {
  display: inline-block;
  font-size: .62rem;
  font-weight: 600;
  color: #1e6fda;
  background: #e6f2ff;
  padding: 2px 10px;
  border-radius: 50px;
  margin: 6px 0 6px;
  line-height: 1.4;
}

.contributor-desc {
  font-size: .7rem;
  color: #7a8fa3;
  line-height: 1.5;
  flex: 1;
}

.contributor-social {
  margin-top: 8px;
  font-size: .68rem;
  color: #4a9eff;
  font-weight: 500;
  text-decoration: none;
}

.contributor-social:hover {
  text-decoration: underline;
}

/* ========== 空状态 ========== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: #8fa3b5;
}

.empty-state .empty-icon {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.empty-state p {
  font-size: .85rem;
}

/* ========== 底部 ========== */
.footer {
  text-align: center;
  padding: 20px 14px 28px;
  font-size: .72rem;
  color: #8fa3b5;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(11,30,51,.88);
  color: #fff;
  padding: 9px 20px;
  border-radius: 50px;
  font-size: .78rem;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease;
  z-index: 9999;
  white-space: nowrap;}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== 隐藏类 ========== */
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">

</div>

<div class="toast" id="toast"></div>

<script>

const backupDomains = [

  { name: '饭太硬', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'http://www.饭太硬.net/tv' },
  { name: '肥猫', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'http://肥猫.net/tv' },
  { name: '摸鱼', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'https://6800.kstore.vip/fish.json' },
  { name: '王二小', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'https://9280.kstore.vip/aiwex.json' },
  { name: '集多', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'http://rihou.cc:88/demo.php' },
  { name: '潇洒', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'https://9877.kstore.space/one.json' },
  { name: '南风', role: '接口作者', desc: '提供优质影视接口源', avatar: '', social: 'https://ghproxy.monkeyray.net/raw.githubusercontent.com/yoursmile66/TVBox/main/XC.json' }
];

const disclaimer = '本站接口资源由【误道者】整理。所有资源均来自互联网，版权归原作者所有。仅供测试学习使用，请勿用于违法及商业用途，请勿付费购买。如涉及侵权，请联系删除。 QQ 群：1067685939';

// ========== 接口数据 ==========
let apiData = [];

// ========== 工具函数 ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => fallbackCopy());
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast('已复制'); } catch(e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

// ========== 渲染 ==========
function renderBackupDomains() {
  const list = document.getElementById('backupDomainsList');
  list.innerHTML = backupDomains.map(d => `<li><a href="${d}" target="_blank">${d}</a></li>`).join('');
}

function renderAbout() {
  document.getElementById('disclaimerText').textContent = disclaimer;
  const list = document.getElementById('contributorsList');
  list.innerHTML = contributors.map(c => `
    <div class="contributor-card">
      <div class="contributor-avatar">${c.avatar ? `<img src="${c.avatar}" alt="${c.name}">` : c.name.charAt(0)}</div>
      <div class="contributor-name">${c.name}</div>
      <span class="contributor-role">${c.role}</span>
      <div class="contributor-desc">${c.desc}</div>
      ${c.social ? `<a class="contributor-social" href="${c.social}" target="_blank">访问主页</a>` : ''}
    </div>
  `).join('');
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  renderBackupDomains();
  renderAbout();
});
</script>
