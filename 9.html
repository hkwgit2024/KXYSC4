<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动线路检测</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: #f8fafc;
    margin: 0;
    padding: 16px;
    color: #0b1e33;
  }

  .status {
    margin-bottom: 12px;
    font-size: .85rem;
    color: #2563eb;
  }

  .copy-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 4px 12px;
    font-size: .72rem;
    cursor: pointer;
  }

  .copy-btn:active {
    opacity: .8;
  }
</style>
</head>

<body>

<div class="status" id="status">⏳ 正在检测可用线路...</div>

<!-- 你提供的备份线路 UI -->
<div style="background:#f8fafc;border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid #eef2f7">
  <h3 style="font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:8px">🌐 备份线路域名</h3>
  <p style="margin-bottom:6px;font-size:.76rem;color:#5a6f88">四个域名互为备份，任一个可用：</p>

  <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:50px;border:1px solid #e0e6ed;margin-top:6px">
    <span style="flex:1;font-size:.75rem;color:#2563eb">https://0.12yue.de5.net</span>
    <button class="copy-btn" data-url="https://0.12yue.de5.net">复制</button>
  </div>

  <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:50px;border:1px solid #e0e6ed;margin-top:6px">
    <span style="flex:1;font-size:.75rem;color:#2563eb">https://0.cdz.qzz.io</span>
    <button class="copy-btn" data-url="https://0.cdz.qzz.io">复制</button>
  </div>

  <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:50px;border:1px solid #e0e6ed;margin-top:6px">
    <span style="flex:1;font-size:.75rem;color:#2563eb">https://0.wdzb.eu.cc</span>
    <button class="copy-btn" data-url="https://0.wdzb.eu.cc">复制</button>
  </div>

  <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:50px;border:1px solid #e0e6ed;margin-top:6px">
    <span style="flex:1;font-size:.75rem;color:#2563eb">https://tvbox.moliys.icu</span>
    <button class="copy-btn" data-url="https://tvbox.moliys.icu">复制</button>
  </div>
</div>

<script>
const domains = [
  "https://0.12yue.de5.net",
  "https://0.cdz.qzz.io",
  "https://0.wdzb.eu.cc",
  "https://tvbox.moliys.icu"
];

const statusEl = document.getElementById("status");

async function checkDomain(url, timeout = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    const res = await fetch(url, {
      method: "GET",
      mode: "no-cors",   // 避免跨域拦截
      signal: controller.signal
    });
    clearTimeout(timer);
    return true;
  } catch (e) {
    clearTimeout(timer);
    return false;
  }
}

async function startCheck() {
  for (let i = 0; i < domains.length; i++) {
    const url = domains[i];
    statusEl.textContent = `⏳ 正在检测第 ${i + 1} 个线路：${url}`;

    const ok = await checkDomain(url);
    if (ok) {
      statusEl.textContent = `✅ 线路可用，正在跳转：${url}`;
      setTimeout(() => {
        window.location.href = url;
      }, 800);
      return;
    }
  }

  statusEl.textContent = "❌ 所有线路均不可用，请稍后再试";
}

/* 复制按钮 */
document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.getAttribute('data-url');
    navigator.clipboard.writeText(text);
    btn.textContent = "已复制";
    setTimeout(() => btn.textContent = "复制", 1500);
  });
});

startCheck();
</script>

</body>
</html>
